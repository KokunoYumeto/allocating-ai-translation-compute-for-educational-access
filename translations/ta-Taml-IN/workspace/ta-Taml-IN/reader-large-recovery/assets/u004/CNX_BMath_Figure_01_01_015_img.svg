<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 116" role="img" aria-labelledby="u004-f015-title u004-f015-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u004-f015-title">327,577,529 என்ற எண்ணின் இடமதிப்புத் தொகுதிகள்</title>
  <desc id="u004-f015-desc">327,577,529 என்ற எண்ணில் காற்புள்ளிகளால் பிரிக்கப்பட்ட மூன்று தொகுதிகள் உள்ளன. 327-க்குக் கீழே மில்லியன்கள், 577-க்குக் கீழே ஆயிரங்கள், 529-க்குக் கீழே ஒன்றுகள் என்ற பெயர்கள் உள்ளன. ஒவ்வொரு பெயருக்கும் மேலே வளைவுக்குறி அதன் இலக்கத் தொகுதியுடன் இணைக்கிறது. இந்தப் படத்தில் சொல்லாக்க வரிசைகளோ அம்புகளோ இல்லை.</desc>
  <g aria-hidden="true" font-family="TamilBook, 'Nirmala UI', sans-serif" fill="#142d38">
