<svg xmlns="http://www.w3.org/2000/svg" width="364" height="220" viewBox="0 0 364 220" role="img" aria-labelledby="m81244-ready-f001-title m81244-ready-f001-desc" font-family="TamilBook, 'Nirmala UI', sans-serif">
  <title id="m81244-ready-f001-title">அடிமானம்-10 கட்டங்களின் மாதிரி</title>
  <desc id="m81244-ready-f001-desc">மூன்று பகுதிகளைக் கொண்ட படம். முதல் பகுதியில் தலா 100 கட்டங்களைக் கொண்ட இரண்டு சதுரங்கள் உள்ளன; ஒவ்வொரு சதுரத்திலும் அகலமாக 10 கட்டங்களும் உயரமாக 10 கட்டங்களும் உள்ளன. இரண்டாவது பகுதியில் 10 கட்டங்களைக் கொண்ட ஒரு கிடைமட்டப் பட்டை உள்ளது. மூன்றாவது பகுதியில் 5 தனிக் கட்டங்கள் உள்ளன.</desc>
