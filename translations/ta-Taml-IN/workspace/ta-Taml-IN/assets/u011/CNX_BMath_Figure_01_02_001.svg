<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2524 632" role="img" aria-labelledby="u011-f001-title u011-f001-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN" data-source-media="fs-id1231518">
<title id="u011-f001-title">17 + 26 கூட்டல்</title>
<desc id="u011-f001-desc">இடப்பகுதியில் 17 என்பது 1 பத்துகள் பட்டையும் 7 ஒன்றுகள் கட்டங்களுமாகக் காட்டப்பட்டுள்ளது; அதன் கீழே +26 என்பது 2 பத்துகள் பட்டைகளும் 6 ஒன்றுகள் கட்டங்களுமாகக் காட்டப்பட்டுள்ளது. ஒவ்வொரு பட்டையிலும் 10 கட்டங்கள் உள்ளன. வலப்புறத்தை நோக்கும் அம்பு மாற்றத்தைக் காட்டுகிறது. வலப்பகுதியில் 4 பத்துகள் பட்டைகளும் 3 ஒன்றுகள் கட்டங்களும் உள்ளன. மேலும் வலப்புறத்தில் 17-க்குக் கீழே +26, கோட்டிற்குக் கீழே 43 என்று எழுதப்பட்டுள்ளது; அதாவது 17 + 26 = 43. பத்துகள் இடத்தின் மேலே சிறிய சிவப்பு 1 உள்ளது. மேலுள்ள பெட்டியில் 1 + 1 + 2 = 4 என்று உள்ளது; சாய்ந்த அம்பு பத்துகள் இடத்தில் சேர்க்கப்பட்ட 1-ஐ நோக்கிச் சுட்டுகிறது.</desc>
