<title id="u011-f020-03-title">324 + 586 கூட்டல்: பத்துகள்</title>
<desc id="u011-f020-03-desc">மேலே 324, கீழே +586 என்ற கூட்டல். கொண்டு செல்லப்பட்ட சிறிய 1-கள், 324-இன் நூறுகள் இலக்கமான 3-க்கும் பத்துகள் இலக்கமான 2-க்கும் மேலே உள்ளன. கோட்டிற்குக் கீழே இதுவரை கிடைத்த விடையாக 10 எழுதப்பட்டுள்ளது.</desc>
