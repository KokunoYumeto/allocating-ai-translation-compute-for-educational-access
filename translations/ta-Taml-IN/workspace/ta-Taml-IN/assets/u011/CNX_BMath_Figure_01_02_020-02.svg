<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 376" role="img" aria-labelledby="u011-f020-02-title u011-f020-02-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN" data-source-media="eip-id1168287268641">
<title id="u011-f020-02-title">324 + 586 கூட்டல்: ஒன்றுகள்</title>
<desc id="u011-f020-02-desc">மேலே 324, கீழே +586 என்ற கூட்டலில் ஒன்றுகள் கூட்டப்படுகின்றன: 4 + 6 = 10. கொண்டு செல்லப்படும் சிறிய 1, 2-க்கு மேலே பத்துகள் இடத்தில் எழுதப்பட்டுள்ளது. கோட்டிற்குக் கீழே ஒன்றுகள் இடத்தில் 0 எழுதப்பட்டுள்ளது.</desc>
