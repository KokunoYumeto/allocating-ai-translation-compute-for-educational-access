<title id="u011-f020-01-title">324 + 586 கூட்டல்: தொடக்க அமைப்பு</title>
<desc id="u011-f020-01-desc">ஒன்றின்கீழ் ஒன்றாக எழுதப்பட்ட கூட்டல்: மேலே 324; கீழே +586; அதன் கீழே கிடைமட்டக் கோடு. ஒன்றுகள், பத்துகள், நூறுகள் ஆகிய இடங்கள் ஒன்றின்கீழ் ஒன்றாக அமைந்துள்ளன.</desc>
