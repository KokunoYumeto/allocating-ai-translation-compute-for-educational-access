<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="u002-f002-title u002-f002-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u002-f002-title">பணத்தாள்களைக் கொண்டு இடமதிப்பு</title>
  <desc id="u002-f002-desc">இடமிருந்து வலமாக: $100 மதிப்புள்ள 3 பணத்தாள்கள், 3 × $100 = $300; $10 மதிப்புள்ள 7 பணத்தாள்கள், 7 × $10 = $70; $1 மதிப்புள்ள 4 பணத்தாள்கள், 4 × $1 = $4. பணத்தாள்கள் எளிய செவ்வகங்களாகக் காட்டப்பட்டுள்ளன.</desc>
  <g aria-hidden="true" font-family="TamilBook, 'Nirmala UI', sans-serif" fill="#142d38" text-anchor="middle">
    <g fill="#eef5ef" stroke="#244938" stroke-width="1.8">
      <rect x="78" y="18" width="84" height="34" rx="3"/><rect x="78" y="64" width="84" height="34" rx="3"/><rect x="78" y="110" width="84" height="34" rx="3"/>
      <rect x="262" y="18" width="84" height="34" rx="3"/><rect x="374" y="18" width="84" height="34" rx="3"/><rect x="262" y="62" width="84" height="34" rx="3"/><rect x="374" y="62" width="84" height="34" rx="3"/><rect x="262" y="106" width="84" height="34" rx="3"/><rect x="374" y="106" width="84" height="34" rx="3"/><rect x="318" y="150" width="84" height="34" rx="3"/>
      <rect x="502" y="40" width="84" height="34" rx="3"/><rect x="614" y="40" width="84" height="34" rx="3"/><rect x="502" y="98" width="84" height="34" rx="3"/><rect x="614" y="98" width="84" height="34" rx="3"/>
    </g>
    <g font-size="20">
      <text x="120" y="42">$100</text><text x="120" y="88">$100</text><text x="120" y="134">$100</text>
      <text x="304" y="42">$10</text><text x="416" y="42">$10</text><text x="304" y="86">$10</text><text x="416" y="86">$10</text><text x="304" y="130">$10</text><text x="416" y="130">$10</text><text x="360" y="174">$10</text>
      <text x="544" y="64">$1</text><text x="656" y="64">$1</text><text x="544" y="122">$1</text><text x="656" y="122">$1</text>
    </g>
    <g font-size="17">
      <text x="120" y="218">$100 மதிப்புள்ள</text><text x="120" y="244">3 பணத்தாள்கள்</text>
      <text x="360" y="218">$10 மதிப்புள்ள</text><text x="360" y="244">7 பணத்தாள்கள்</text>
      <text x="600" y="218">$1 மதிப்புள்ள</text><text x="600" y="244">4 பணத்தாள்கள்</text>
    </g>
    <g font-size="22">
      <text x="120" y="284">3 × $100 = $300</text><text x="360" y="284">7 × $10 = $70</text><text x="600" y="284">4 × $1 = $4</text>
    </g>
  </g>
</svg>
