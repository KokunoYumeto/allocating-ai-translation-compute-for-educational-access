<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" role="img" aria-labelledby="u002-f004-title u002-f004-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u002-f004-title">1, 10, 100 ஆகியவற்றைக் குறிக்கும் கட்டங்கள்</title>
  <desc id="u002-f004-desc">ஒரு தனிக் கட்டம் 1-ஐக் குறிக்கிறது. ஒரு பட்டையில் கிடைமட்டமாக 10 கட்டங்கள் உள்ளன; அது 10-ஐக் குறிக்கிறது. ஒரு சதுரத்தில் 10 வரிசைகள் உள்ளன; ஒவ்வொரு வரிசையிலும் 10 கட்டங்கள் உள்ளன. சதுரம் 100-ஐக் குறிக்கிறது.</desc>
  <g aria-hidden="true">
    <g fill="#e9f7f7" stroke="#193b4b" stroke-width="1.4">
      <rect x="326" y="26" width="18" height="18"/>
      <rect x="326" y="102" width="180" height="18"/><path d="M344 102 V120 M362 102 V120 M380 102 V120 M398 102 V120 M416 102 V120 M434 102 V120 M452 102 V120 M470 102 V120 M488 102 V120"/>
      <rect x="326" y="178" width="180" height="180"/>
      <path d="M344 178 V358 M362 178 V358 M380 178 V358 M398 178 V358 M416 178 V358 M434 178 V358 M452 178 V358 M470 178 V358 M488 178 V358 M326 196 H506 M326 214 H506 M326 232 H506 M326 250 H506 M326 268 H506 M326 286 H506 M326 304 H506 M326 322 H506 M326 340 H506"/>
    </g>
    <g font-family="TamilBook, 'Nirmala UI', sans-serif" font-size="20" fill="#142d38">
      <text x="18" y="37">ஒரு தனிக் கட்டம்</text><text x="18" y="66">குறிப்பது: 1</text>
      <text x="18" y="112">ஒரு பட்டை</text><text x="18" y="141">குறிப்பது: 10</text>
      <text x="18" y="201">ஒரு சதுரம்</text><text x="18" y="230">குறிப்பது: 100</text>
    </g>
  </g>
</svg>
