<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 190" role="img" aria-labelledby="u002-f003-title u002-f003-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u002-f003-title">$300 + $70 + $4 என்பதன் மொத்தம் $374</title>
  <desc id="u002-f003-desc">மேலே $300 + $70 + $4; கீழே $374. $300-இன் 3, $70-இன் 7, $4-இன் 4 ஆகிய இலக்கங்களிலிருந்து கீழேயுள்ள $374-இன் அதே இலக்கங்களுக்கு அம்புகள் செல்கின்றன. இணைக்கப்பட்ட இலக்கங்கள் அடர்சிவப்பில் உள்ளன.</desc>
  <defs><marker id="u002-f003-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#00646a"/></marker></defs>
  <g aria-hidden="true" font-family="TamilBook, 'Nirmala UI', sans-serif" font-size="32" fill="#142d38">
    <text x="32" y="42">$</text><text x="56" y="42" fill="#a21d25">3</text><text x="80" y="42">00</text><text x="150" y="42">+</text>
    <text x="196" y="42">$</text><text x="220" y="42" fill="#a21d25">7</text><text x="244" y="42">0</text><text x="306" y="42">+</text>
    <text x="354" y="42">$</text><text x="378" y="42" fill="#a21d25">4</text>
    <g fill="none" stroke="#00646a" stroke-width="2.5" marker-end="url(#u002-f003-arrow)"><path d="M66 56 L211 131"/><path d="M230 56 L235 131"/><path d="M388 56 L259 131"/></g>
    <text x="178" y="173">$</text><text x="202" y="173" fill="#a21d25">3</text><text x="226" y="173" fill="#a21d25">7</text><text x="250" y="173" fill="#a21d25">4</text>
  </g>
</svg>
