<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" role="img" aria-labelledby="u006-f031-title u006-f031-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u006-f031-title">76-ஐ அருகிலுள்ள பத்துகளுக்கு முழுமையாக்குதல்</title>
  <desc id="u006-f031-desc">76 என்ற எண்ணில் 6 குறுக்குக்கோடிட்டு அடிக்கப்பட்டுள்ளது; அதை நோக்கிய அம்பின் குறிப்பு ‘0-ஆல் மாற்றுங்கள்’ என்கிறது. 7-ஐ நோக்கிய அம்பின் குறிப்பு ‘1-ஐக் கூட்டுங்கள்’ என்கிறது. கீழே 80 காட்டப்பட்டுள்ளது. 76-ஐ அருகிலுள்ள பத்துகளுக்கு முழுமையாக்கினால் 80 கிடைக்கும் என்ற விளக்கமும் உள்ளது.</desc>
  <defs>
    <marker id="u006-f031-teal-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#00646a"/></marker>
    <marker id="u006-f031-red-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a21d25"/></marker>
  </defs>
