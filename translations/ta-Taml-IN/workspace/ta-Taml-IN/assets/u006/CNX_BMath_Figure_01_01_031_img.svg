    <text id="u006-f031-sentence" x="50" y="243" font-size="24" fill="#142d38" text-anchor="start">76-ஐ அருகிலுள்ள பத்துகளுக்கு முழுமையாக்கினால் 80 கிடைக்கும்.</text>
