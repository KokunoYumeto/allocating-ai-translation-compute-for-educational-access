  <title id="u006-f021-title">75 குறிக்கப்பட்ட எண் கோடு</title>
  <desc id="u006-f021-desc">70 முதல் 80 வரை தலா 1 இடைவெளியில் எண்கள் குறிக்கப்பட்ட எண் கோடு. 70 மற்றும் 80 சிவப்பாக உள்ளன. 75 என்ற எண்ணின் இடத்தில் ஒரு புள்ளி குறிக்கப்பட்டுள்ளது.</desc>
