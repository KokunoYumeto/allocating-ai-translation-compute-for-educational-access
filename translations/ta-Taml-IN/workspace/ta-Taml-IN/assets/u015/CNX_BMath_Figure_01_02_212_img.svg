<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="u015-f212-title u015-f212-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u015-f212-title">பக்க நீளங்கள் குறிக்கப்பட்ட சரிவகம்</title>
  <desc id="u015-f212-desc">ஒரு சரிவகம். கிடைமட்ட மேல் பக்கத்தின் நீளம் 19 யார்டு; சாய்வான இரு பக்கங்களின் நீளம் தலா 18 யார்டு; கிடைமட்டக் கீழ்ப் பக்கத்தின் நீளம் 16 யார்டு.</desc>
  <g id="u015-f212-visual" aria-hidden="true" font-family="TamilBook, 'Nirmala UI', sans-serif" fill="#142d38">
    <rect id="u015-f212-background" width="1000" height="600" fill="#fff"/>
    <path id="u015-f212-outline" d="M270 100 H730 L645 490 H355 Z" fill="#fff" stroke="#17242b" stroke-width="3" stroke-linejoin="miter"/>
    <text id="u015-f212-label-1" x="500" y="67" text-anchor="middle" font-size="24" font-weight="600">19 யார்டு</text>
    <text id="u015-f212-label-2" x="500" y="545" text-anchor="middle" font-size="24" font-weight="600">16 யார்டு</text>
    <text id="u015-f212-label-3" x="245" y="325" text-anchor="end" font-size="24" font-weight="600">18 யார்டு</text>
    <text id="u015-f212-label-4" x="755" y="325" text-anchor="start" font-size="24" font-weight="600">18 யார்டு</text>
  </g>
</svg>

