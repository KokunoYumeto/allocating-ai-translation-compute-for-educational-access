<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 384" role="img" aria-labelledby="u015-f222-title u015-f222-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u015-f222-title">காலிக் கட்டங்களைக் கொண்ட கூட்டல் அட்டவணை</title>
  <desc id="u015-f222-desc">5 நெடுவரிசைகளும் 8 வரிசைகளும் கொண்ட கூட்டல் அட்டவணை. முதல் வரிசை மற்றும் முதல் நெடுவரிசையின் கட்டங்கள் மற்ற கட்டங்களைவிட அடர்ந்த நிறத்தில் உள்ளன. அவற்றைத் தவிர மற்ற கட்டங்கள் அனைத்தும் காலியாக உள்ளன. முதல் வரிசையில் “+; 6; 7; 8; 9” உள்ளன. முதல் நெடுவரிசையில் “+; 3; 4; 5; 6; 7; 8; 9” உள்ளன.</desc>
