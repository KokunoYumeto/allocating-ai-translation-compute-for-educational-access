<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="u015-f214-title u015-f214-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u015-f214-title">ஆறு பக்க நீளங்களும் குறிக்கப்பட்ட படிநிலை வடிவம்</title>
  <desc id="u015-f214-desc">செவ்வகத்தை ஒத்த, ஆறு நேரான பக்கங்களைக் கொண்ட வடிவம். மேல் இடது மூலையிலிருந்து முதல் பக்கம் 24 அடி வலப்புறம் செல்கிறது. அதன் முடிவிலிருந்து இரண்டாம் பக்கம் 7 அடி கீழே செல்கிறது. மூன்றாம் பக்கம் 19 அடி இடப்புறமும், நான்காம் பக்கம் 3 அடி மேலேயும், ஐந்தாம் பக்கம் 5 அடி இடப்புறமும் செல்கின்றன. ஆறாம் பக்கம் 4 அடி மேலே சென்று முதல் பக்கம் தொடங்கிய மூலையை அடைகிறது.</desc>
  <g id="u015-f214-visual" aria-hidden="true" font-family="TamilBook, 'Nirmala UI', sans-serif" fill="#142d38">
    <rect id="u015-f214-background" width="1000" height="400" fill="#fff"/>
