    <text id="u015-f214-label-1" x="500" y="90" text-anchor="middle" font-size="24" font-weight="600">24 அடி</text>
    <text id="u015-f214-label-2" x="880" y="205" text-anchor="end" font-size="24" font-weight="600">7 அடி</text>
    <text id="u015-f214-label-3" x="585" y="300" text-anchor="middle" font-size="24" font-weight="600">19 அடி</text>
    <text id="u015-f214-label-4" x="290" y="280" text-anchor="start" font-size="24" font-weight="600">3 அடி</text>
    <text id="u015-f214-label-5" x="175" y="245" text-anchor="middle" font-size="24" font-weight="600">5 அடி</text>
    <text id="u015-f214-label-6" x="115" y="140" text-anchor="start" font-size="24" font-weight="600">4 அடி</text>
  </g>
