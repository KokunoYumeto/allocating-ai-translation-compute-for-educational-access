<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 224 60" role="img" aria-labelledby="u015-f201-title u015-f201-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u015-f201-title">2 + 4 கூட்டலுக்கான கட்ட மாதிரி</title>
  <desc id="u015-f201-desc">2 + 4 என்ற முழு எண்களின் கூட்டலுக்கான கட்ட மாதிரி. இடப்புறம் இரண்டு ஒன்றுகள் கட்டங்களும் வலப்புறம் நான்கு ஒன்றுகள் கட்டங்களும் உள்ளன.</desc>
  <g id="u015-f201-visual" aria-hidden="true" font-family="TamilBook, 'Nirmala UI', sans-serif" fill="#142d38">
