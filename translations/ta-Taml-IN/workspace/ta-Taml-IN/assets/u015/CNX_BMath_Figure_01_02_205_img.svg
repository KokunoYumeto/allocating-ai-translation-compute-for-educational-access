<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 276" role="img" aria-labelledby="u015-f205-title u015-f205-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u015-f205-title">14 + 75 கூட்டலுக்கான கட்ட மாதிரி</title>
  <desc id="u015-f205-desc">14 + 75 என்ற முழு எண்களின் கூட்டலுக்கான கட்ட மாதிரி. இடப்புறம் எட்டு கிடைமட்டப் பத்துகள் பட்டைகள் உள்ளன. வலப்புறம், மூன்று வரிசைகளில் தலா மூன்று வீதம் ஒன்பது ஒன்றுகள் கட்டங்கள் உள்ளன.</desc>
