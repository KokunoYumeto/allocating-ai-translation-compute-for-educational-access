<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 288" role="img" aria-labelledby="u015-f225-title u015-f225-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u015-f225-title">முழுமையான கூட்டல் அட்டவணை</title>
  <desc id="u015-f225-desc">6 நெடுவரிசைகளும் 6 வரிசைகளும் கொண்ட கூட்டல் அட்டவணை. முதல் வரிசை மற்றும் முதல் நெடுவரிசையின் கட்டங்கள் மற்ற கட்டங்களைவிட அடர்ந்த நிறத்தில் உள்ளன. ஒவ்வொரு நெடுவரிசையிலும் மேலிருந்து கீழாக உள்ள மதிப்புகள்: முதல் நெடுவரிசை: “+; 5; 6; 7; 8; 9”. இரண்டாம் நெடுவரிசை: “5; 10; 11; 12; 13; 14”. மூன்றாம் நெடுவரிசை: “6; 11; 12; 13; 14; 15”. நான்காம் நெடுவரிசை: “7; 12; 13; 14; 15; 16”. ஐந்தாம் நெடுவரிசை: “8; 13; 14; 15; 16; 17”. ஆறாம் நெடுவரிசை: “9; 14; 15; 16; 17; 18”.</desc>
