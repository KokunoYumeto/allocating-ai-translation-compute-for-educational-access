<title id="u010-f016_img-03-title">2 மற்றும் 6 ஒன்றுகள் கட்டங்கள்</title>
<desc id="u010-f016_img-03-desc">இடப்புறம் 2 ஒன்றுகள் கட்டங்கள்; இடைவெளிக்குப் பின் வலப்புறம் 6 ஒன்றுகள் கட்டங்கள். குழுக்களின் கீழே முறையே 2 மற்றும் 6 என்று எழுதப்பட்டுள்ளது.</desc>
