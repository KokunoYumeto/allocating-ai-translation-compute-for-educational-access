<title id="u010-f017_img-03-title">5 மற்றும் 8 ஒன்றுகள் கட்டங்கள்</title>
<desc id="u010-f017_img-03-desc">இடப்புறம் 5 ஒன்றுகள் கட்டங்கள்; இடைவெளிக்குப் பின் வலப்புறம் 8 ஒன்றுகள் கட்டங்கள். குழுக்களின் கீழே முறையே 5 மற்றும் 8 என்று எழுதப்பட்டுள்ளது.</desc>
