<title id="u010-f007_img-title">5 + 1 = 6 என்ற கூட்டல் மாதிரி</title>
<desc id="u010-f007_img-desc">இடப்புறம் 5 ஒன்றுகள் கட்டங்கள்; இடைவெளிக்குப் பின் வலப்புறம் 1 ஒன்றுகள் கட்டம். அவற்றின் கீழே 5 + 1 = 6 என்று எழுதப்பட்டுள்ளது.</desc>
<rect width="468" height="204" fill="#ffffff" aria-hidden="true"/>
