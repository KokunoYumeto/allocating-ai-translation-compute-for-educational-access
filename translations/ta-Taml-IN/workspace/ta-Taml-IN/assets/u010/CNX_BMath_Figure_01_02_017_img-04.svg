<title id="u010-f017_img-04-title">10 ஒன்றுகளை ஒரு பத்தாக மாற்றுதல்</title>
<desc id="u010-f017_img-04-desc">மேல் வரிசையில் 5, 5, 3 ஒன்றுகள் கட்டங்கள் கொண்ட குழுக்கள் உள்ளன. முதல் 10 கட்டங்களைச் சுற்றிய இளஞ்சிவப்புக் கோடு கீழுள்ள சிவப்புப் பத்துகள் பட்டையை நோக்கிச் சுட்டுகிறது. அந்தப் பட்டையில் 10 இணைந்த கட்டங்கள் உள்ளன; அதன் வலப்புறம் 3 ஒன்றுகள் கட்டங்கள் உள்ளன.</desc>
