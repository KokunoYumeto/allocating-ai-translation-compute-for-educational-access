<title id="u010-f014_img-title">15 + 27 = 42 என்ற கூட்டல் மாதிரி</title>
<desc id="u010-f014_img-desc">இடப்புறம் ஒன்றின்கீழ் ஒன்றாக 4 பத்துகள் பட்டைகள்; ஒவ்வொரு பட்டையிலும் 10 இணைந்த கட்டங்கள் உள்ளன. வலப்புறம் 2 ஒன்றுகள் கட்டங்கள் உள்ளன. கீழே 15 + 27 = 42 என்று எழுதப்பட்டுள்ளது.</desc>
