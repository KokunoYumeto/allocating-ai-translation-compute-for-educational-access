<title id="u010-f010_img-title">5 + 7 = 12 என்ற கூட்டல் மாதிரி</title>
<desc id="u010-f010_img-desc">இடப்புறம் 10 இணைந்த கட்டங்களைக் கொண்ட 1 பத்துகள் பட்டை; வலப்புறம் 2 ஒன்றுகள் கட்டங்கள். கீழே 5 + 7 = 12 என்று எழுதப்பட்டுள்ளது.</desc>
