<title id="u010-f018_img-03-title">26-க்கான பத்துகள் மற்றும் ஒன்றுகள் மாதிரி</title>
<desc id="u010-f018_img-03-desc">இடப்புறம் ஒன்றின்கீழ் ஒன்றாக 2 பத்துகள் பட்டைகள்; ஒவ்வொரு பட்டையிலும் 10 இணைந்த கட்டங்கள் உள்ளன. வலப்புறம் 6 ஒன்றுகள் கட்டங்கள் இரண்டு வரிசைகளில் தலா 3 வீதம் உள்ளன.</desc>
