<title id="u010-f019_img-03-title">3 மற்றும் 4 ஒன்றுகள் கட்டங்கள்</title>
<desc id="u010-f019_img-03-desc">இடப்புறம் 3 ஒன்றுகள் கட்டங்கள்; இடைவெளிக்குப் பின் வலப்புறம் 4 ஒன்றுகள் கட்டங்கள். குழுக்களின் கீழே முறையே 3 மற்றும் 4 என்று எழுதப்பட்டுள்ளது.</desc>
