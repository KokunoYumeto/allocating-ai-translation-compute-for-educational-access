    <text id="u008-appb001-skill-4" data-row="4" font-size="22"><tspan x="40" y="534">இடமதிப்பைப் பயன்படுத்தி </tspan><tspan x="40" y="568">முழு எண்களை எழுத முடியும்.</tspan></text>
