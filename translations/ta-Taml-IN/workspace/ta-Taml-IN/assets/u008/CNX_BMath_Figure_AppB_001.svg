<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1392 700" role="img" aria-labelledby="u008-appb001-title u008-appb001-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u008-appb001-title">சுய மதிப்பீட்டு அட்டவணை</title>
  <desc id="u008-appb001-desc">சுய மதிப்பீட்டு அட்டவணை. முதல் நெடுவரிசையின் தலைப்பு ‘என்னால்…’. மற்ற மூன்று நெடுவரிசைகள்: ‘நம்பிக்கையுடன்’, ‘சிறிது உதவியுடன்’, ‘இல்லை—எனக்குப் புரியவில்லை!’. ஆறு திறன்கள்: இயல் எண்களையும் முழு எண்களையும் அடையாளம் காணுதல்; முழு எண்களை மாதிரிகளால் காட்டுதல்; ஓர் இலக்கத்தின் இடமதிப்பைக் கண்டறிதல்; இடமதிப்பைப் பயன்படுத்தி முழு எண்களின் பெயர்களைக் கூறுதல்; இடமதிப்பைப் பயன்படுத்தி முழு எண்களை எழுதுதல்; முழு எண்களை முழுமையாக்குதல். ஒவ்வொரு திறனுக்கும் தேர்வைக் குறிக்க மூன்று காலிப் பதில் இடங்கள் உள்ளன.</desc>
  <g aria-hidden="true" font-family="TamilBook, 'Nirmala UI', sans-serif" fill="#142d38">
    <rect width="1392" height="700" fill="white"/>
    <rect id="u008-appb001-header-cell-0" data-column="0" x="16" y="16" width="560" height="104" fill="#cce8e9" stroke="#2a8d99" stroke-width="1.5"/>
    <text id="u008-appb001-header-0" data-column="0" font-size="24" font-weight="600" text-anchor="start"><tspan x="40" y="78">என்னால்…</tspan></text>
    <rect id="u008-appb001-header-cell-1" data-column="1" x="576" y="16" width="250" height="104" fill="#cce8e9" stroke="#2a8d99" stroke-width="1.5"/>
    <text id="u008-appb001-header-1" data-column="1" font-size="24" font-weight="600" text-anchor="middle"><tspan x="701" y="78">நம்பிக்கையுடன்</tspan></text>
    <rect id="u008-appb001-header-cell-2" data-column="2" x="826" y="16" width="250" height="104" fill="#cce8e9" stroke="#2a8d99" stroke-width="1.5"/>
    <text id="u008-appb001-header-2" data-column="2" font-size="24" font-weight="600" text-anchor="middle"><tspan x="951" y="78">சிறிது உதவியுடன்</tspan></text>
    <rect id="u008-appb001-header-cell-3" data-column="3" x="1076" y="16" width="300" height="104" fill="#cce8e9" stroke="#2a8d99" stroke-width="1.5"/>
    <text id="u008-appb001-header-3" data-column="3" font-size="24" font-weight="600" text-anchor="middle"><tspan x="1226" y="60">இல்லை—எனக்குப் </tspan><tspan x="1226" y="94">புரியவில்லை!</tspan></text>
    <rect id="u008-appb001-skill-cell-r0-c0" data-row="0" data-column="0" x="16" y="120" width="560" height="94" fill="#edf7f7" stroke="#2a8d99" stroke-width="1.5"/>
    <rect id="u008-appb001-response-r0-c1" data-row="0" data-column="1" data-response-cell="blank" x="576" y="120" width="250" height="94" fill="white" stroke="#2a8d99" stroke-width="1.5"/>
    <rect id="u008-appb001-response-r0-c2" data-row="0" data-column="2" data-response-cell="blank" x="826" y="120" width="250" height="94" fill="#edf7f7" stroke="#2a8d99" stroke-width="1.5"/>
    <rect id="u008-appb001-response-r0-c3" data-row="0" data-column="3" data-response-cell="blank" x="1076" y="120" width="300" height="94" fill="white" stroke="#2a8d99" stroke-width="1.5"/>
    <text id="u008-appb001-skill-0" data-row="0" font-size="22"><tspan x="40" y="158">இயல் எண்களையும் முழு எண்களையும் </tspan><tspan x="40" y="192">அடையாளம் காண முடியும்.</tspan></text>
    <rect id="u008-appb001-skill-cell-r1-c0" data-row="1" data-column="0" x="16" y="214" width="560" height="94" fill="#edf7f7" stroke="#2a8d99" stroke-width="1.5"/>
    <rect id="u008-appb001-response-r1-c1" data-row="1" data-column="1" data-response-cell="blank" x="576" y="214" width="250" height="94" fill="white" stroke="#2a8d99" stroke-width="1.5"/>
    <rect id="u008-appb001-response-r1-c2" data-row="1" data-column="2" data-response-cell="blank" x="826" y="214" width="250" height="94" fill="#edf7f7" stroke="#2a8d99" stroke-width="1.5"/>
    <rect id="u008-appb001-response-r1-c3" data-row="1" data-column="3" data-response-cell="blank" x="1076" y="214" width="300" height="94" fill="white" stroke="#2a8d99" stroke-width="1.5"/>
    <text id="u008-appb001-skill-1" data-row="1" font-size="22"><tspan x="40" y="252">முழு எண்களை மாதிரிகளால் </tspan><tspan x="40" y="286">காட்ட முடியும்.</tspan></text>
    <rect id="u008-appb001-skill-cell-r2-c0" data-row="2" data-column="0" x="16" y="308" width="560" height="94" fill="#edf7f7" stroke="#2a8d99" stroke-width="1.5"/>
    <rect id="u008-appb001-response-r2-c1" data-row="2" data-column="1" data-response-cell="blank" x="576" y="308" width="250" height="94" fill="white" stroke="#2a8d99" stroke-width="1.5"/>
    <rect id="u008-appb001-response-r2-c2" data-row="2" data-column="2" data-response-cell="blank" x="826" y="308" width="250" height="94" fill="#edf7f7" stroke="#2a8d99" stroke-width="1.5"/>
