    <text id="u008-appb001-skill-2" data-row="2" font-size="22"><tspan x="40" y="346">ஓர் இலக்கத்தின் இடமதிப்பைக் </tspan><tspan x="40" y="380">கண்டறிய முடியும்.</tspan></text>
    <rect id="u008-appb001-skill-cell-r3-c0" data-row="3" data-column="0" x="16" y="402" width="560" height="94" fill="#edf7f7" stroke="#2a8d99" stroke-width="1.5"/>
    <rect id="u008-appb001-response-r3-c1" data-row="3" data-column="1" data-response-cell="blank" x="576" y="402" width="250" height="94" fill="white" stroke="#2a8d99" stroke-width="1.5"/>
    <rect id="u008-appb001-response-r3-c2" data-row="3" data-column="2" data-response-cell="blank" x="826" y="402" width="250" height="94" fill="#edf7f7" stroke="#2a8d99" stroke-width="1.5"/>
    <rect id="u008-appb001-response-r3-c3" data-row="3" data-column="3" data-response-cell="blank" x="1076" y="402" width="300" height="94" fill="white" stroke="#2a8d99" stroke-width="1.5"/>
    <text id="u008-appb001-skill-3" data-row="3" font-size="22"><tspan x="40" y="440">இடமதிப்பைப் பயன்படுத்தி முழு எண்களின் </tspan><tspan x="40" y="474">பெயர்களைக் கூற முடியும்.</tspan></text>
    <rect id="u008-appb001-skill-cell-r4-c0" data-row="4" data-column="0" x="16" y="496" width="560" height="94" fill="#edf7f7" stroke="#2a8d99" stroke-width="1.5"/>
    <rect id="u008-appb001-response-r4-c1" data-row="4" data-column="1" data-response-cell="blank" x="576" y="496" width="250" height="94" fill="white" stroke="#2a8d99" stroke-width="1.5"/>
