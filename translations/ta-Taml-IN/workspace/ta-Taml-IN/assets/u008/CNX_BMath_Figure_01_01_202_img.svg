<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 402" role="img" aria-labelledby="u008-f202-title u008-f202-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u008-f202-title">மூன்று வகை அடிமானம்-10 கட்டங்கள்</title>
  <desc id="u008-f202-desc">மூன்று வகைக் கட்டங்கள்: தலா 100 ஒன்றுகள் கொண்ட மூன்று நூறுகள் சதுரங்கள்; ஒவ்வொரு சதுரமும் 10 கட்டங்கள் அகலமும் 10 கட்டங்கள் உயரமும் கொண்டது. தலா 10 ஒன்றுகள் கொண்ட எட்டு கிடைமட்டப் பத்துகள் பட்டைகள். தனியாக 4 ஒன்றுகள் கட்டங்கள்.</desc>
