<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1264 600" data-source-media="fs-id588598" role="img" lang="ta-Taml-IN" xml:lang="ta-Taml-IN" aria-labelledby="u013-f002-title u013-f002-desc">
  <title id="u013-f002-title">ஆறு பக்கங்களின் நீளங்கள்</title>
  <desc id="u013-f002-desc">ஆறு பக்கங்களைக் கொண்ட முற்றத்தின் எல்லையைக் காட்டும் படம். இடது ஓரப் பக்கம் 4 அடி என்றும், மேல் பக்கம் 9 அடி என்றும், வலது பக்கத்திலுள்ள குறுகிய பக்கம் 2 அடி என்றும் குறிக்கப்பட்டுள்ளன. அங்கிருந்து இடப்புறமாகச் செல்லும் பக்கம் 3 அடி எனக் குறிக்கப்பட்டுள்ளது. அடுத்து, கீழ்நோக்கிச் செல்லும் பக்கம் 2 அடி எனக் குறிக்கப்பட்டுள்ளது. இறுதியாக, அடிப்பக்கம் 6 அடி எனக் குறிக்கப்பட்டுள்ளது. உள்புறச் செங்குத்துப் பக்கத்தை ஒரு வெளிர் பச்சைநீல அம்புக்குறி சுட்டுகிறது.</desc>
