<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1082 446" role="img" aria-labelledby="u003-f012-title u003-f012-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u003-f012-title">63,407,218-க்கான இடமதிப்பு அட்டவணை</title>
  <desc id="u003-f012-desc">15 இடமதிப்பு நெடுவரிசைகள், தலா 3 நெடுவரிசைகள் கொண்ட 5 இடமதிப்புத் தொகுதிகளாக உள்ளன. தொகுதிகள்: டிரில்லியன்கள், பில்லியன்கள், மில்லியன்கள், ஆயிரங்கள், ஒன்றுகள். இடமிருந்து வலமாக இடங்கள்: நூறு டிரில்லியன்கள்; பத்து டிரில்லியன்கள்; டிரில்லியன்கள்; நூறு பில்லியன்கள்; பத்து பில்லியன்கள்; பில்லியன்கள்; நூறு மில்லியன்கள்; பத்து மில்லியன்கள்; மில்லியன்கள்; நூறாயிரங்கள்; பத்தாயிரங்கள்; ஆயிரங்கள்; நூறுகள்; பத்துகள்; ஒன்றுகள். முதல் 7 இலக்கக் கட்டங்கள் காலியாக உள்ளன. அடுத்து பத்து மில்லியன்கள் இடத்தில் 6, மில்லியன்கள் இடத்தில் 3, நூறாயிரங்கள் இடத்தில் 4, பத்தாயிரங்கள் இடத்தில் 0, ஆயிரங்கள் இடத்தில் 7, நூறுகள் இடத்தில் 2, பத்துகள் இடத்தில் 1, ஒன்றுகள் இடத்தில் 8 உள்ளன. காட்டப்படும் எண் 63,407,218. தொகுதித் தலைப்புகள், இடப் பெயர்கள், இலக்கங்கள் ஆகிய மூன்று கிடைமட்டப் பகுதிகள் உள்ளன; தனித் தலைப்புப் பகுதி இல்லை.</desc>
