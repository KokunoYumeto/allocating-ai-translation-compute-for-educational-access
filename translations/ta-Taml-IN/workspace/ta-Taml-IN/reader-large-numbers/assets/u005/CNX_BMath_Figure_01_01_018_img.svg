<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 260" role="img" aria-labelledby="u005-f018-title u005-f018-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u005-f018-title">சொற்களிலிருந்து இலக்கங்களுக்கு: 77,000,000,000</title>
  <desc id="u005-f018-desc">நான்கு இடமதிப்புத் தொகுதிகள்: பில்லியன்கள், மில்லியன்கள், ஆயிரங்கள், ஒன்றுகள். முதல் தொகுதியின் கீழே மட்டும் 77 பில்லியன் என்று உள்ளது. நான்கு கீழ்நோக்கிய அம்புகள் முறையே 77, 000, 000, 000 என்ற இலக்கத் தொகுதிகளுக்குச் செல்கின்றன. முதல் தொகுதியின் இடதுகோடி இடம் காலியாக உள்ளது; மற்ற மூன்று தொகுதிகளின் ஒன்பது இடங்களிலும் 0 வெளிப்படையாக எழுதப்பட்டுள்ளது. இவை 77,000,000,000 என்ற எண்ணைக் காட்டுகின்றன.</desc>
