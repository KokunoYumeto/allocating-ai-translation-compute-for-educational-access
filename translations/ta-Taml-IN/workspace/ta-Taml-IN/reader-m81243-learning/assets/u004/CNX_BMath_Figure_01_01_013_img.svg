<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 334" role="img" aria-labelledby="u004-f013-title u004-f013-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u004-f013-title">37,519,248 என்ற எண்ணைச் சொற்களால் எழுதுதல்</title>
  <desc id="u004-f013-desc">37,519,248 என்ற எண்ணின் 37, 519, 248 ஆகிய தொகுதிகள் காற்புள்ளிகளால் பிரிக்கப்பட்டுள்ளன. கீழே முறையே மில்லியன்கள், ஆயிரங்கள், ஒன்றுகள் என்ற பெயர்கள் உள்ளன. இடமதிப்புத் தொகுதிகள் என்ற குறிப்பிலிருந்து இந்தப் பெயர்களை நோக்கி இடப்புறமாக ஓர் அம்பு உள்ளது. அடுத்த மூன்று வரிசைகளில் 37-இலிருந்து முப்பத்து ஏழு மில்லியன் என்பதற்கும், 519-இலிருந்து ஐந்நூற்றுப் பத்தொன்பது ஆயிரம் என்பதற்கும், 248-இலிருந்து இருநூற்று நாற்பத்து எட்டு என்பதற்கும் வலப்புறமாக அம்புகள் செல்கின்றன.</desc>
