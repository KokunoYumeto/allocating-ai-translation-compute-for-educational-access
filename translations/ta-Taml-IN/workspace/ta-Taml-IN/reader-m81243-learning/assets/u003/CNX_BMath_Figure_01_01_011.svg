<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1082 492" role="img" aria-labelledby="u003-f011-title u003-f011-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u003-f011-title">5,278,194-க்கான இடமதிப்பு அட்டவணை</title>
  <desc id="u003-f011-desc">15 இடமதிப்பு நெடுவரிசைகள், தலா 3 நெடுவரிசைகள் கொண்ட 5 இடமதிப்புத் தொகுதிகளாக உள்ளன. தொகுதிகள்: டிரில்லியன்கள், பில்லியன்கள், மில்லியன்கள், ஆயிரங்கள், ஒன்றுகள். இடமிருந்து வலமாக இடங்கள்: நூறு டிரில்லியன்கள்; பத்து டிரில்லியன்கள்; டிரில்லியன்கள்; நூறு பில்லியன்கள்; பத்து பில்லியன்கள்; பில்லியன்கள்; நூறு மில்லியன்கள்; பத்து மில்லியன்கள்; மில்லியன்கள்; நூறாயிரங்கள்; பத்தாயிரங்கள்; ஆயிரங்கள்; நூறுகள்; பத்துகள்; ஒன்றுகள். முதல் 8 இலக்கக் கட்டங்கள் காலியாக உள்ளன. அடுத்து மில்லியன்கள் இடத்தில் 5, நூறாயிரங்கள் இடத்தில் 2, பத்தாயிரங்கள் இடத்தில் 7, ஆயிரங்கள் இடத்தில் 8, நூறுகள் இடத்தில் 1, பத்துகள் இடத்தில் 9, ஒன்றுகள் இடத்தில் 4 உள்ளன. காட்டப்படும் எண் 5,278,194.</desc>
