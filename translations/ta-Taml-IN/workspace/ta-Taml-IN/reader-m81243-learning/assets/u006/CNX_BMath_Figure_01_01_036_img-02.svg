<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="u006-f036-02-title u006-f036-02-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u006-f036-02-title">3,978-ஐ அருகிலுள்ள நூறுகளுக்கு முழுமையாக்குதல்: மறுதொகுப்பு</title>
  <desc id="u006-f036-02-desc">3,978-ஐ அருகிலுள்ள நூறுகளுக்கு முழுமையாக்கும் படம். 7-இன் கீழ் கோடிடப்பட்டுள்ளது. நூறுகள் இலக்கமான 9-உடன் 1-ஐக் கூட்ட: 9 + 1 = 10. நூறுகள் இடத்தில் 0 எழுதுங்கள்; ஆயிரங்கள் இடத்தில் உள்ள இலக்கத்துடன் 1-ஐக் கூட்டுங்கள். மீதமுள்ள 7 மற்றும் 8-ஐ பூச்சியங்களால் மாற்றுங்கள். கிடைக்கும் எண் 4,000.</desc>
  <defs>
    <marker id="u006-f036-02-teal-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#00646a"/></marker>
