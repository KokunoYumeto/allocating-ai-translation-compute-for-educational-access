<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" role="img" aria-labelledby="u006-f022-title u006-f022-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u006-f022-title">76: பத்துகள் இடமும் வலப்புற இலக்கமும்</title>
  <desc id="u006-f022-desc">76 என்ற எண் காட்டப்பட்டுள்ளது. ‘பத்துகள் இடம்’ என்ற குறிப்பு 7-ஐக் காட்டுகிறது. ‘5-ஐ விடப் பெரியது’ என்ற குறிப்பு 6-ஐக் காட்டுகிறது. 6-இன் கீழ் கோடிடப்பட்டுள்ளது.</desc>
  <defs>
