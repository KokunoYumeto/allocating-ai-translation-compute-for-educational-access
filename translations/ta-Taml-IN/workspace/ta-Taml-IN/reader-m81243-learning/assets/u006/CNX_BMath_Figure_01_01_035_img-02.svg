  <title id="u006-f035-02-title">23,658-ஐ அருகிலுள்ள நூறுகளுக்கு முழுமையாக்குதல்</title>
  <desc id="u006-f035-02-desc">23,658 என்ற எண்ணில் 6-ஐ நோக்கிய அம்பு ‘1-ஐக் கூட்டுங்கள்’ என்கிறது. 5 மற்றும் 8 ஆகிய இலக்கங்களை நோக்கிய அம்பு ‘0-களால் மாற்றுங்கள்’ என்கிறது. கீழே கிடைக்கும் எண் 23,700.</desc>
  <defs>
