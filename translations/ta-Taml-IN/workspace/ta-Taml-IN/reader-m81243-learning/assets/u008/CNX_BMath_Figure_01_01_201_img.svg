<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 540" role="img" aria-labelledby="u008-f201-title u008-f201-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u008-f201-title">நூறுகள் சதுரங்களும் பத்துகள் பட்டைகளும் ஒன்றுகள் கட்டமும்</title>
  <desc id="u008-f201-desc">மூன்று வகைக் கட்டங்கள்: தலா 100 ஒன்றுகள் கொண்ட ஐந்து நூறுகள் சதுரங்கள்; ஒவ்வொரு சதுரமும் 10 கட்டங்கள் அகலமும் 10 கட்டங்கள் உயரமும் கொண்டது. தலா 10 ஒன்றுகள் கொண்ட ஆறு கிடைமட்டப் பத்துகள் பட்டைகள். தனியாக 1 ஒன்றுகள் கட்டம்.</desc>
