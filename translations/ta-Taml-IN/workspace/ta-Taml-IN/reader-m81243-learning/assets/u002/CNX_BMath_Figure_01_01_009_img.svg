<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 515 215" role="img" aria-labelledby="u002-f009-title u002-f009-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u002-f009-title">பயிற்சி: கட்டங்கள் காட்டும் எண்ணைக் கண்டறியுங்கள்</title>
  <desc id="u002-f009-desc">இடப்புறம் ஒரு சதுரம்: 10 வரிசைகள், ஒவ்வொரு வரிசையிலும் 10 கட்டங்கள். நடுவில் 7 கிடைமட்டப் பட்டைகள்; ஒவ்வொன்றிலும் 10 கட்டங்கள். வலப்புறம் 6 தனிக் கட்டங்கள், இரண்டு வரிசைகளில் வரிசைக்கு 3 கட்டங்களாக உள்ளன.</desc>
