<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 215" role="img" aria-labelledby="u002-f007-title u002-f007-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u002-f007-title">கட்டங்கள் காட்டும் எண்ணைக் கண்டறியுங்கள்</title>
  <desc id="u002-f007-desc">இடப்புறம் 2 சதுரங்கள் உள்ளன. ஒவ்வொரு சதுரத்திலும் 10 வரிசைகள்; ஒவ்வொரு வரிசையிலும் 10 கட்டங்கள். வலப்புறம் 10 கட்டங்கள் கொண்ட ஒரு கிடைமட்டப் பட்டையும், அதற்குக் கீழே 5 தனிக் கட்டங்களும் உள்ளன.</desc>
  <defs><g id="u002-f007-hundred"><rect width="180" height="180"/><path d="M18 0 V180 M36 0 V180 M54 0 V180 M72 0 V180 M90 0 V180 M108 0 V180 M126 0 V180 M144 0 V180 M162 0 V180 M0 18 H180 M0 36 H180 M0 54 H180 M0 72 H180 M0 90 H180 M0 108 H180 M0 126 H180 M0 144 H180 M0 162 H180"/></g></defs>
