<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 575 195" role="img" aria-labelledby="u002-f010-title u002-f010-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u002-f010-title">பயிற்சி: கட்டங்கள் காட்டும் எண்ணைக் கண்டறியுங்கள்</title>
  <desc id="u002-f010-desc">இடப்புறம் 2 சதுரங்கள்; ஒவ்வொரு சதுரத்திலும் 10 வரிசைகள், ஒவ்வொரு வரிசையிலும் 10 கட்டங்கள். வலப்புறம் 3 கிடைமட்டப் பட்டைகள்; ஒவ்வொன்றிலும் 10 கட்டங்கள். அவற்றிற்குக் கீழே 7 தனிக் கட்டங்கள்: முதல் வரிசையில் 4, இரண்டாம் வரிசையில் 3.</desc>
  <defs>
    <g id="u002-f010-hundred"><rect width="160" height="160"/><path d="M16 0 V160 M32 0 V160 M48 0 V160 M64 0 V160 M80 0 V160 M96 0 V160 M112 0 V160 M128 0 V160 M144 0 V160 M0 16 H160 M0 32 H160 M0 48 H160 M0 64 H160 M0 80 H160 M0 96 H160 M0 112 H160 M0 128 H160 M0 144 H160"/></g>
