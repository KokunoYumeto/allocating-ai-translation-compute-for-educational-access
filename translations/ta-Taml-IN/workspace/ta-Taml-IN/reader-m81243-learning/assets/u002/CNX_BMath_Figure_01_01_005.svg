<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 625 235" role="img" aria-labelledby="u002-f005-title u002-f005-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u002-f005-title">1 நூறு, 3 பத்துகள், 8 ஒன்றுகள்</title>
  <desc id="u002-f005-desc">இடமிருந்து வலமாக: 10 வரிசைகளிலும் 10 நெடுவரிசைகளிலும் கட்டங்கள் கொண்ட ஒரு சதுரம்; ஒவ்வொன்றிலும் 10 கட்டங்கள் கொண்ட 3 கிடைமட்டப் பட்டைகள்; 8 தனிக் கட்டங்கள். இவை 138-ஐக் குறிக்கின்றன.</desc>
  <defs>
    <g id="u002-f005-hundred"><rect width="160" height="160"/><path d="M16 0 V160 M32 0 V160 M48 0 V160 M64 0 V160 M80 0 V160 M96 0 V160 M112 0 V160 M128 0 V160 M144 0 V160 M0 16 H160 M0 32 H160 M0 48 H160 M0 64 H160 M0 80 H160 M0 96 H160 M0 112 H160 M0 128 H160 M0 144 H160"/></g>
