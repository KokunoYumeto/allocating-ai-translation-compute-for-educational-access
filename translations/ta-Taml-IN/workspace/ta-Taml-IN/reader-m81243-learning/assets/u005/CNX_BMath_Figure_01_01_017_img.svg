<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1840 260" role="img" aria-labelledby="u005-f017-title u005-f017-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u005-f017-title">சொற்களிலிருந்து இலக்கங்களுக்கு: 9,246,073,189</title>
  <desc id="u005-f017-desc">நான்கு இடமதிப்புத் தொகுதிகள்: பில்லியன்கள், மில்லியன்கள், ஆயிரங்கள், ஒன்றுகள். மேலே முறையே ஒன்பது பில்லியன், இருநூற்று நாற்பத்து ஆறு மில்லியன், எழுபத்து மூன்று ஆயிரம், நூற்று எண்பத்து ஒன்பது என்ற சொற்கள் உள்ளன. அம்புகள் கீழே 9, 246, 073, 189 என்ற இலக்கத் தொகுதிகளுக்குச் செல்கின்றன. ஒவ்வொரு தொகுதிக்கும் மூன்று இலக்க இடங்கள் உள்ளன. முதல் தொகுதியின் முதல் இரண்டு இடங்கள் காலியாக உள்ளன; ஆயிரங்கள் தொகுதியில் தொடக்க 0 வெளிப்படையாக உள்ளது. இத்தொகுதிகள் 9,246,073,189 என்ற எண்ணை உருவாக்குகின்றன.</desc>
