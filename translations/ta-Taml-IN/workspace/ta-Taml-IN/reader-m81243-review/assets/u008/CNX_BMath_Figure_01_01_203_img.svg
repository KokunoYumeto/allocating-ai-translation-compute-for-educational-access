<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 358" role="img" aria-labelledby="u008-f203-title u008-f203-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u008-f203-title">நூறுகள் சதுரங்களும் தனி ஒன்றுகள் கட்டங்களும்</title>
  <desc id="u008-f203-desc">இரண்டு வகைக் கட்டங்கள்: தலா 100 ஒன்றுகள் கொண்ட நான்கு நூறுகள் சதுரங்கள்; ஒவ்வொரு சதுரமும் 10 கட்டங்கள் அகலமும் 10 கட்டங்கள் உயரமும் கொண்டது. தனியாக 7 ஒன்றுகள் கட்டங்கள். பத்துகள் பட்டைகள் இல்லை.</desc>
