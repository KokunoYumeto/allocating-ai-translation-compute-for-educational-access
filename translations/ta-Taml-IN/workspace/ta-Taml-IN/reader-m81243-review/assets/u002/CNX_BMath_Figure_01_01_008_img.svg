<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 190" role="img" aria-labelledby="u002-f008-title u002-f008-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u002-f008-title">200 + 10 + 5 என்பதன் மொத்தம் 215</title>
  <desc id="u002-f008-desc">மேலே 200 + 10 + 5; கீழே 215. 200-இன் 2, 10-இன் 1, 5 ஆகிய இலக்கங்களிலிருந்து கீழேயுள்ள 215-இன் அதே இலக்கங்களுக்கு அம்புகள் செல்கின்றன. இணைக்கப்பட்ட இலக்கங்கள் அடர்சிவப்பில் உள்ளன.</desc>
  <defs><marker id="u002-f008-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#00646a"/></marker></defs>
  <g aria-hidden="true" font-family="TamilBook, 'Nirmala UI', sans-serif" font-size="32" fill="#142d38">
    <text x="30" y="42" fill="#a21d25">2</text><text x="54" y="42">00</text><text x="124" y="42">+</text>
    <text x="178" y="42" fill="#a21d25">1</text><text x="202" y="42">0</text><text x="262" y="42">+</text><text x="324" y="42" fill="#a21d25">5</text>
    <g fill="none" stroke="#00646a" stroke-width="2.5" marker-end="url(#u002-f008-arrow)"><path d="M40 56 L162 131"/><path d="M188 56 L186 131"/><path d="M334 56 L210 131"/></g>
    <text x="152" y="173" fill="#a21d25">2</text><text x="176" y="173" fill="#a21d25">1</text><text x="200" y="173" fill="#a21d25">5</text>
  </g>
</svg>
