<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-labelledby="title desc" lang="ta-Taml-IN">
  <title id="title">எண் கோடு: 0 முதல் 6 வரை</title>
  <desc id="desc">புள்ளிகள் சம இடைவெளிகளில் உள்ளன. வலப்புறம் செல்ல எண்கள் பெரிதாகின்றன. இடப்புறம் செல்ல எண்கள் சிறிதாகின்றன. மூலப் படம் CNX_BMath_Figure_01_01_001-இன் தமிழில் மறுவரைவு.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0 L7 3.5 L0 7" fill="black"/></marker></defs>
  <g fill="none" stroke="black" stroke-width="2">
    <path d="M40 105 H605" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M60 96 V114 M140 96 V114 M220 96 V114 M300 96 V114 M380 96 V114 M460 96 V114 M540 96 V114"/>
    <path d="M340 67 H560" marker-end="url(#arrow)"/>
    <path d="M285 67 H65" marker-end="url(#arrow)"/>
  </g>
  <g font-family="TamilBook, 'Noto Sans Tamil', 'Nirmala UI', sans-serif" text-anchor="middle" fill="black">
    <text x="170" y="43" font-size="21">சிறிதாகும்</text><text x="450" y="43" font-size="21">பெரிதாகும்</text>
    <g font-size="24"><text x="60" y="145">0</text><text x="140" y="145">1</text><text x="220" y="145">2</text><text x="300" y="145">3</text><text x="380" y="145">4</text><text x="460" y="145">5</text><text x="540" y="145">6</text></g>
  </g>
</svg>
