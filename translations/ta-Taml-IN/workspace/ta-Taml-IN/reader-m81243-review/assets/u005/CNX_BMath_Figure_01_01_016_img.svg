<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 260" role="img" aria-labelledby="u005-f016-title u005-f016-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u005-f016-title">சொற்களிலிருந்து இலக்கங்களுக்கு: 53,401,742</title>
  <desc id="u005-f016-desc">மூன்று இடமதிப்புத் தொகுதிகள்: மில்லியன்கள், ஆயிரங்கள், ஒன்றுகள். மேலே முறையே ஐம்பத்து மூன்று மில்லியன், நானூற்று ஒன்று ஆயிரம், எழுநூற்று நாற்பத்து இரண்டு என்ற சொற்கள் உள்ளன. அவற்றிலிருந்து கீழ்நோக்கிய அம்புகள் 53, 401, 742 என்ற இலக்கத் தொகுதிகளுக்குச் செல்கின்றன. ஒவ்வொரு தொகுதிக்கும் மூன்று இலக்க இடங்கள் கோடுகளால் காட்டப்பட்டுள்ளன; முதல் தொகுதியின் இடதுகோடி இடம் காலியாக உள்ளது. இத்தொகுதிகள் 53,401,742 என்ற எண்ணை உருவாக்குகின்றன.</desc>
  <defs><marker id="u005-f016-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#00646a"/></marker></defs>
