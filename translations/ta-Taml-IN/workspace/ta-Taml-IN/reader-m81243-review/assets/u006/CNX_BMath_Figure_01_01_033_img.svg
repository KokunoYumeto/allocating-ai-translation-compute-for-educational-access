<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 205" role="img" aria-labelledby="u006-f033-title u006-f033-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u006-f033-title">72-ஐ அருகிலுள்ள பத்துகளுக்கு முழுமையாக்குதல்</title>
  <desc id="u006-f033-desc">72 என்ற எண்ணில் 2 குறுக்குக்கோடிட்டு அடிக்கப்பட்டுள்ளது; அதை நோக்கிய அம்பின் குறிப்பு ‘0-ஆல் மாற்றுங்கள்’ என்கிறது. 7-ஐ நோக்கிய அம்பின் குறிப்பு ‘1-ஐக் கூட்ட வேண்டாம்’ என்கிறது. கீழே 70 காட்டப்பட்டுள்ளது.</desc>
  <defs>
    <marker id="u006-f033-teal-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#00646a"/></marker>
    <marker id="u006-f033-red-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a21d25"/></marker>
  </defs>
