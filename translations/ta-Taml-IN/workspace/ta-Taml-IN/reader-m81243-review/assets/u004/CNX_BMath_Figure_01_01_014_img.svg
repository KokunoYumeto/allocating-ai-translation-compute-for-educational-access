<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 474" role="img" aria-labelledby="u004-f014-title u004-f014-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u004-f014-title">8,165,432,098,710 என்ற எண்ணைச் சொற்களால் எழுதுதல்</title>
  <desc id="u004-f014-desc">8,165,432,098,710 என்ற எண்ணின் 8, 165, 432, 098, 710 ஆகிய தொகுதிகள் காற்புள்ளிகளால் பிரிக்கப்பட்டுள்ளன. அவற்றுக்குக் கீழே முறையே டிரில்லியன்கள், பில்லியன்கள், மில்லியன்கள், ஆயிரங்கள், ஒன்றுகள் என்ற பெயர்கள் உள்ளன. அடுத்த ஐந்து வரிசைகளில் ஒவ்வொரு தொகுதியிலிருந்தும் அதன் தமிழ்ப் பெயருக்கு வலப்புறமாக ஓர் அம்பு செல்கிறது: 8 — எட்டு டிரில்லியன்; 165 — நூற்று அறுபத்து ஐந்து பில்லியன்; 432 — நானூற்று முப்பத்து இரண்டு மில்லியன்; 098 — தொண்ணூற்று எட்டு ஆயிரம்; 710 — எழுநூற்றுப் பத்து. 098 என்பது மேலேயும் நான்காவது அம்பு வரிசையிலும் அதன் தொடக்க 0 உடன் எழுதப்பட்டுள்ளது. முதல் நான்கு சொல்லாக்கங்களுக்குப் பின் காற்புள்ளிகள் உள்ளன.</desc>
