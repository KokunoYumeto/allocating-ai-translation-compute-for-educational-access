<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="u015-f210-title u015-f210-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u015-f210-title">பக்க நீளங்கள் குறிக்கப்பட்ட செவ்வகம்</title>
  <desc id="u015-f210-desc">ஒரு செவ்வகம். மேல் மற்றும் கீழ்ப் பக்கங்கள் தலா 21 மீட்டர் நீளமும், இடது மற்றும் வலப்பக்கங்கள் தலா 7 மீட்டர் உயரமும் கொண்டவை.</desc>
  <g id="u015-f210-visual" aria-hidden="true" font-family="TamilBook, 'Nirmala UI', sans-serif" fill="#142d38">
    <rect id="u015-f210-background" width="1000" height="380" fill="#fff"/>
    <path id="u015-f210-outline" d="M250 85 H750 V275 H250 Z" fill="#fff" stroke="#17242b" stroke-width="3" stroke-linejoin="miter"/>
    <text id="u015-f210-label-1" x="500" y="55" text-anchor="middle" font-size="24" font-weight="600">21 மீட்டர்</text>
    <text id="u015-f210-label-2" x="500" y="330" text-anchor="middle" font-size="24" font-weight="600">21 மீட்டர்</text>
    <text id="u015-f210-label-3" x="220" y="190" text-anchor="end" font-size="24" font-weight="600">7 மீட்டர்</text>
    <text id="u015-f210-label-4" x="780" y="190" text-anchor="start" font-size="24" font-weight="600">7 மீட்டர்</text>
  </g>
