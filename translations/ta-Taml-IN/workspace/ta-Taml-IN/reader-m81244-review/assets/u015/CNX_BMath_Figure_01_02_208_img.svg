<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="u015-f208-title u015-f208-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u015-f208-title">பக்க நீளங்கள் குறிக்கப்பட்ட முக்கோணம்</title>
  <desc id="u015-f208-desc">ஒரு முக்கோணம். இடப்புறச் சாய்வுப் பக்கத்தின் நீளம் 14 அங்குலம், வலப்புறச் சாய்வுப் பக்கத்தின் நீளம் 12 அங்குலம், அடிப்பக்கத்தின் நீளம் 18 அங்குலம்.</desc>
  <g id="u015-f208-visual" aria-hidden="true" font-family="TamilBook, 'Nirmala UI', sans-serif" fill="#142d38">
    <rect id="u015-f208-background" width="1000" height="500" fill="#fff"/>
    <path id="u015-f208-outline" d="M500 55 L160 390 H840 Z" fill="#fff" stroke="#17242b" stroke-width="3" stroke-linejoin="miter"/>
    <text id="u015-f208-label-1" x="230" y="235" text-anchor="end" font-size="24" font-weight="600">14 அங்குலம்</text>
    <text id="u015-f208-label-2" x="770" y="235" text-anchor="start" font-size="24" font-weight="600">12 அங்குலம்</text>
    <text id="u015-f208-label-3" x="500" y="445" text-anchor="middle" font-size="24" font-weight="600">18 அங்குலம்</text>
  </g>
</svg>

