<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="u015-f209-title u015-f209-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u015-f209-title">பக்க நீளங்கள் குறிக்கப்பட்ட செங்கோண முக்கோணம்</title>
  <desc id="u015-f209-desc">ஒரு செங்கோண முக்கோணம். அடிப்பக்கத்தின் நீளம் 12 சென்டிமீட்டர், இடப்புறச் செங்குத்துப் பக்கத்தின் உயரம் 5 சென்டிமீட்டர், சாய்வான கர்ணத்தின் நீளம் 13 சென்டிமீட்டர்.</desc>
  <g id="u015-f209-visual" aria-hidden="true" font-family="TamilBook, 'Nirmala UI', sans-serif" fill="#142d38">
    <rect id="u015-f209-background" width="1000" height="440" fill="#fff"/>
    <path id="u015-f209-outline" d="M260 55 V345 H900 Z" fill="#fff" stroke="#17242b" stroke-width="3" stroke-linejoin="miter"/>
    <text id="u015-f209-label-1" x="230" y="215" text-anchor="end" font-size="24" font-weight="600">5 சென்டிமீட்டர்</text>
    <text id="u015-f209-label-2" x="585" y="405" text-anchor="middle" font-size="24" font-weight="600">12 சென்டிமீட்டர்</text>
    <text id="u015-f209-label-3" x="670" y="150" text-anchor="start" font-size="24" font-weight="600">13 சென்டிமீட்டர்</text>
  </g>
</svg>

