<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 148" role="img" aria-labelledby="u015-f207-title u015-f207-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u015-f207-title">16 + 25 கூட்டலுக்கான கட்ட மாதிரி</title>
  <desc id="u015-f207-desc">16 + 25 என்ற முழு எண்களின் கூட்டலுக்கான கட்ட மாதிரி. இடப்புறம் நான்கு கிடைமட்டப் பத்துகள் பட்டைகளும் வலப்புறம் ஓர் ஒன்றுகள் கட்டமும் உள்ளன.</desc>
