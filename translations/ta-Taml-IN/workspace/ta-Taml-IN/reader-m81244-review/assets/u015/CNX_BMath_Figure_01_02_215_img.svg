<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="u015-f215-title u015-f215-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u015-f215-title">ஒரு பக்க நீளம் குறிக்கப்படாத ஆறு பக்கப் படிநிலை வடிவம்</title>
  <desc id="u015-f215-desc">6 நேரான பக்கங்களைக் கொண்ட வடிவம். மேல் இடது மூலையிலிருந்து முதல் பக்கம் 25 அங்குலம் வலப்புறம் செல்கிறது. அதன் முடிவிலிருந்து இரண்டாம் பக்கம் 10 அங்குலம் கீழே செல்கிறது. மூன்றாம் பக்கம் 14 அங்குலம் இடப்புறமும், நான்காம் பக்கம் 7 அங்குலம் மேலேயும், ஐந்தாம் பக்கம் 11 அங்குலம் இடப்புறமும் செல்கின்றன. நீளம் குறிக்கப்படாத ஆறாம் பக்கம் மேலே சென்று முதல் பக்கம் தொடங்கிய மூலையை அடைகிறது.</desc>
  <g id="u015-f215-visual" aria-hidden="true" font-family="TamilBook, 'Nirmala UI', sans-serif" fill="#142d38">
    <rect id="u015-f215-background" width="1100" height="500" fill="#fff"/>
    <path id="u015-f215-outline" d="M80 55 H1020 V440 H490 V175 H80 Z" fill="#fff" stroke="#17242b" stroke-width="3" stroke-linejoin="miter"/>
    <text id="u015-f215-label-1" x="550" y="98" text-anchor="middle" font-size="24" font-weight="600">25 அங்குலம்</text>
    <text id="u015-f215-label-2" x="985" y="265" text-anchor="end" font-size="24" font-weight="600">10 அங்குலம்</text>
    <text id="u015-f215-label-3" x="755" y="410" text-anchor="middle" font-size="24" font-weight="600">14 அங்குலம்</text>
    <text id="u015-f215-label-4" x="515" y="310" text-anchor="start" font-size="24" font-weight="600">7 அங்குலம்</text>
    <text id="u015-f215-label-5" x="285" y="155" text-anchor="middle" font-size="24" font-weight="600">11 அங்குலம்</text>
  </g>
</svg>

