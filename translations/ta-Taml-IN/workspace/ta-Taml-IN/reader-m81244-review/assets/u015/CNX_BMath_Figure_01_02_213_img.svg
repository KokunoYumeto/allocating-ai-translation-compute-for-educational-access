<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="u015-f213-title u015-f213-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u015-f213-title">பக்க நீளங்கள் குறிக்கப்பட்ட சரிவகம்</title>
  <desc id="u015-f213-desc">ஒரு சரிவகம். கிடைமட்ட மேல் பக்கத்தின் நீளம் 24 மீட்டர்; சாய்வான இரு பக்கங்களின் நீளம் தலா 17 மீட்டர்; கிடைமட்டக் கீழ்ப் பக்கத்தின் நீளம் 29 மீட்டர்.</desc>
  <g id="u015-f213-visual" aria-hidden="true" font-family="TamilBook, 'Nirmala UI', sans-serif" fill="#142d38">
    <rect id="u015-f213-background" width="1000" height="520" fill="#fff"/>
    <path id="u015-f213-outline" d="M350 90 H650 L820 410 H180 Z" fill="#fff" stroke="#17242b" stroke-width="3" stroke-linejoin="miter"/>
    <text id="u015-f213-label-1" x="500" y="58" text-anchor="middle" font-size="24" font-weight="600">24 மீட்டர்</text>
    <text id="u015-f213-label-2" x="500" y="465" text-anchor="middle" font-size="24" font-weight="600">29 மீட்டர்</text>
    <text id="u015-f213-label-3" x="225" y="285" text-anchor="end" font-size="24" font-weight="600">17 மீட்டர்</text>
    <text id="u015-f213-label-4" x="775" y="285" text-anchor="start" font-size="24" font-weight="600">17 மீட்டர்</text>
  </g>
</svg>

