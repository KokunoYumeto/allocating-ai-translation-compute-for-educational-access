<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="u015-f211-title u015-f211-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u015-f211-title">பக்க நீளங்கள் குறிக்கப்பட்ட செவ்வகம்</title>
  <desc id="u015-f211-desc">ஒரு செவ்வகம். மேல் மற்றும் கீழ்ப் பக்கங்கள் தலா 19 அடி நீளமும், இடது மற்றும் வலப்பக்கங்கள் தலா 14 அடி உயரமும் கொண்டவை.</desc>
  <g id="u015-f211-visual" aria-hidden="true" font-family="TamilBook, 'Nirmala UI', sans-serif" fill="#142d38">
    <rect id="u015-f211-background" width="1000" height="470" fill="#fff"/>
    <path id="u015-f211-outline" d="M250 75 H750 V355 H250 Z" fill="#fff" stroke="#17242b" stroke-width="3" stroke-linejoin="miter"/>
    <text id="u015-f211-label-1" x="500" y="45" text-anchor="middle" font-size="24" font-weight="600">19 அடி</text>
    <text id="u015-f211-label-2" x="500" y="415" text-anchor="middle" font-size="24" font-weight="600">19 அடி</text>
    <text id="u015-f211-label-3" x="220" y="220" text-anchor="end" font-size="24" font-weight="600">14 அடி</text>
    <text id="u015-f211-label-4" x="780" y="220" text-anchor="start" font-size="24" font-weight="600">14 அடி</text>
  </g>
</svg>

