<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 312 60" role="img" aria-labelledby="u015-f203-title u015-f203-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u015-f203-title">8 + 4 கூட்டலுக்கான கட்ட மாதிரி</title>
  <desc id="u015-f203-desc">8 + 4 என்ற முழு எண்களின் கூட்டலுக்கான கட்ட மாதிரி. இடப்புறம் ஒரு கிடைமட்டப் பத்துகள் பட்டையும் வலப்புறம் இரண்டு ஒன்றுகள் கட்டங்களும் உள்ளன.</desc>
  <g id="u015-f203-visual" aria-hidden="true" font-family="TamilBook, 'Nirmala UI', sans-serif" fill="#142d38">
