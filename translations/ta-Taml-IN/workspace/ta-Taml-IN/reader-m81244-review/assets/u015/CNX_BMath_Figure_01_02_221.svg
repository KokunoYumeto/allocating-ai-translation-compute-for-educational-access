<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 240" role="img" aria-labelledby="u015-f221-title u015-f221-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="u015-f221-title">முழுமையான கூட்டல் அட்டவணை</title>
  <desc id="u015-f221-desc">8 நெடுவரிசைகளும் 5 வரிசைகளும் கொண்ட கூட்டல் அட்டவணை. முதல் வரிசை மற்றும் முதல் நெடுவரிசையின் கட்டங்கள் மற்ற கட்டங்களைவிட அடர்ந்த நிறத்தில் உள்ளன. ஒவ்வொரு நெடுவரிசையிலும் மேலிருந்து கீழாக உள்ள மதிப்புகள்: முதல் நெடுவரிசை: “+; 6; 7; 8; 9”. இரண்டாம் நெடுவரிசை: “3; 9; 10; 11; 12”. மூன்றாம் நெடுவரிசை: “4; 10; 11; 12; 13”. நான்காம் நெடுவரிசை: “5; 11; 12; 13; 14”. ஐந்தாம் நெடுவரிசை: “6; 12; 13; 14; 15”. ஆறாம் நெடுவரிசை: “7; 13; 14; 15; 16”. ஏழாம் நெடுவரிசை: “8; 14; 15; 16; 17”. எட்டாம் நெடுவரிசை: “9; 15; 16; 17; 18”.</desc>
