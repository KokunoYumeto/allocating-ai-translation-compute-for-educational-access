<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 964 568" data-source-media="fs-id2175999" role="img" lang="ta-Taml-IN" xml:lang="ta-Taml-IN" aria-labelledby="u013-f003-title u013-f003-desc">
  <title id="u013-f003-title">எட்டுப் பக்கங்களின் நீளங்கள்</title>
  <desc id="u013-f003-desc">இந்தப் படத்தில் 8 பக்கங்கள் உள்ளன. படத்தில் நீளங்களைக் குறிக்கும் எண்கள் மட்டும் உள்ளன; கேள்வியில் நீளங்களின் அலகு அங்குலம் எனத் தரப்பட்டுள்ளது. இடது பக்கத்திலுள்ள முதல் பக்கத்தின் நீளம் 4 அங்குலம்; மேலுள்ள 2-ஆம் பக்கத்தின் நீளம் 9 அங்குலம்; வலதிலுள்ள 3-ஆம் பக்கத்தின் நீளம் 4 அங்குலம். 4-ஆம் பக்கத்தின் நீளம் 3 அங்குலம், 5-ஆம் பக்கத்தின் நீளம் 2 அங்குலம், 6-ஆம் பக்கத்தின் நீளம் 3 அங்குலம், 7-ஆம் பக்கத்தின் நீளம் 2 அங்குலம், 8-ஆம் பக்கத்தின் நீளம் 3 அங்குலம்.</desc>
  <rect width="100%" height="100%" fill="#fff" aria-hidden="true"/>
