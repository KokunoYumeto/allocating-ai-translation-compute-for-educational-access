<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 612" data-source-media="fs-id1381557" role="img" lang="ta-Taml-IN" xml:lang="ta-Taml-IN" aria-labelledby="u013-f004-title u013-f004-desc">
  <title id="u013-f004-title">எட்டுப் பக்கங்களின் நீளங்கள்</title>
  <desc id="u013-f004-desc">இந்தப் படத்தில் 8 பக்கங்கள் உள்ளன. படத்தில் நீளங்களைக் குறிக்கும் எண்கள் மட்டும் உள்ளன; கேள்வியில் நீளங்களின் அலகு அங்குலம் எனத் தரப்பட்டுள்ளது. இடது மேல்புறச் சிறிய பக்கத்திலிருந்து கடிகாரத் திசையில் சுற்றிச் சென்றால், முதல் பக்கத்தின் நீளம் 2 அங்குலம். 2-ஆம் பக்கத்தின் நீளம் 12 அங்குலம், 3-ஆம் பக்கத்தின் நீளம் 6 அங்குலம், 4-ஆம் பக்கத்தின் நீளம் 4 அங்குலம், 5-ஆம் பக்கத்தின் நீளம் 2 அங்குலம், 6-ஆம் பக்கத்தின் நீளம் 4 அங்குலம், 7-ஆம் பக்கத்தின் நீளம் 2 அங்குலம், 8-ஆம் பக்கத்தின் நீளம் 4 அங்குலம்.</desc>
  <rect width="100%" height="100%" fill="#fff" aria-hidden="true"/>
