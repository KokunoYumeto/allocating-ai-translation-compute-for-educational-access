<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1490 500" role="img" aria-labelledby="m81244-tail-f002a-title m81244-tail-f002a-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN">
  <title id="m81244-tail-f002a-title">கூட்டல் கற்றல் நோக்கங்களுக்கான சுய மதிப்பீட்டு அட்டவணை</title>
  <desc id="m81244-tail-f002a-desc">சுய மதிப்பீட்டு அட்டவணை. முதல் நெடுவரிசையின் தலைப்பு ‘என்னால்…’. மற்ற மூன்று நெடுவரிசைகள்: ‘நம்பிக்கையுடன்’, ‘சிறிது உதவியுடன்’, ‘இல்லை—எனக்குப் புரியவில்லை!’. ஐந்து திறன் கூற்றுகள்: ‘கூட்டல் குறியீட்டைப் பயன்படுத்த முடியும்.’; ‘முழு எண்களின் கூட்டலை மாதிரிகளால் காட்ட முடியும்.’; ‘மாதிரிகள் இல்லாமல் முழு எண்களைக் கூட்ட முடியும்.’; ‘சொற்றொடர்களைக் கணிதக் குறியீட்டில் எழுத முடியும்.’; ‘பயன்பாட்டுக் கணக்குகளில் முழு எண்களைக் கூட்ட முடியும்.’. ஒவ்வொரு திறனுக்கும் தேர்வைக் குறிக்க மூன்று காலிப் பதில் இடங்கள் உள்ளன.</desc>
  <g id="m81244-tail-f002a-visual" aria-hidden="true" font-family="TamilBook, 'Nirmala UI', sans-serif" fill="#142d38">
    <rect id="m81244-tail-f002a-background" width="1490" height="500" fill="#fff"/>
    <g id="m81244-tail-f002a-r0c0" data-row="0" data-column="0" data-role="header"><rect x="0" y="0" width="760" height="120" fill="#a7dadd" stroke="#2699a2" stroke-width="2"/><text x="18" y="70" font-size="28" font-weight="500">என்னால்…</text></g>
    <g id="m81244-tail-f002a-r0c1" data-row="0" data-column="1" data-role="header"><rect x="760" y="0" width="190" height="120" fill="#a7dadd" stroke="#2699a2" stroke-width="2"/><text x="855" y="70" text-anchor="middle" font-size="20" font-weight="700">நம்பிக்கையுடன்</text></g>
    <g id="m81244-tail-f002a-r0c2" data-row="0" data-column="2" data-role="header"><rect x="950" y="0" width="240" height="120" fill="#a7dadd" stroke="#2699a2" stroke-width="2"/><text x="1070" y="52" text-anchor="middle" font-size="23" font-weight="700"><tspan x="1070" dy="0">சிறிது</tspan><tspan x="1070" dy="31">உதவியுடன்</tspan></text></g>
    <g id="m81244-tail-f002a-r0c3" data-row="0" data-column="3" data-role="header"><rect x="1190" y="0" width="300" height="120" fill="#a7dadd" stroke="#2699a2" stroke-width="2"/><text x="1340" y="52" text-anchor="middle" font-size="22" font-weight="700"><tspan x="1340" dy="0">இல்லை—எனக்குப்</tspan><tspan x="1340" dy="31">புரியவில்லை!</tspan></text></g>
    <g id="m81244-tail-f002a-r1c0" data-row="1" data-column="0" data-role="ability"><rect x="0" y="120" width="760" height="76" fill="#edf8f8" stroke="#2699a2" stroke-width="1.5"/><text x="18" y="169" font-size="22" font-weight="500">கூட்டல் குறியீட்டைப் பயன்படுத்த முடியும்.</text></g>
