<title id="u010-f011_img-title">6 + 8 = 14 என்ற கூட்டல் மாதிரி</title>
<desc id="u010-f011_img-desc">இடப்புறம் 10 இணைந்த கட்டங்களைக் கொண்ட 1 பத்துகள் பட்டை; வலப்புறம் 4 ஒன்றுகள் கட்டங்கள். கீழே 6 + 8 = 14 என்று எழுதப்பட்டுள்ளது.</desc>
