<title id="u010-f006_img-title">3 + 6 = 9 என்ற கூட்டல் மாதிரி</title>
<desc id="u010-f006_img-desc">இடப்புறம் 3 ஒன்றுகள் கட்டங்கள்; இடைவெளிக்குப் பின் வலப்புறம் 6 ஒன்றுகள் கட்டங்கள். அவற்றின் கீழே 3 + 6 = 9 என்று எழுதப்பட்டுள்ளது.</desc>
