<title id="u010-f018_img-05-title">4 பத்துகளும் 3 ஒன்றுகளும்</title>
<desc id="u010-f018_img-05-desc">இடப்புறம் ஒன்றின்கீழ் ஒன்றாக 4 பத்துகள் பட்டைகள்; ஒவ்வொரு பட்டையிலும் 10 இணைந்த கட்டங்கள் உள்ளன. மேலுள்ள 3 பட்டைகளுக்குக் கீழே சிவப்புப் பட்டை உள்ளது. வலப்புறம் 3 ஒன்றுகள் கட்டங்கள் ஒரே வரிசையில் உள்ளன.</desc>
