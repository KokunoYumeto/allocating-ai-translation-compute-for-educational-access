<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1308 332" role="img" aria-labelledby="u010-f018_img-04-title u010-f018_img-04-desc" lang="ta-Taml-IN" xml:lang="ta-Taml-IN" data-source-media="eip-id1168289744408">
<title id="u010-f018_img-04-title">3 பத்துகளும் 13 ஒன்றுகளும்</title>
<desc id="u010-f018_img-04-desc">இடப்புறம் ஒன்றின்கீழ் ஒன்றாக 3 பத்துகள் பட்டைகள்; ஒவ்வொரு பட்டையிலும் 10 இணைந்த கட்டங்கள் உள்ளன. வலப்புறம் 13 ஒன்றுகள் கட்டங்கள் உள்ளன. அவற்றில் 10 சிவப்புக் கட்டங்கள் இரண்டு வரிசைகளில் தலா 5 வீதம் உள்ளன; மீதமுள்ள 3 கட்டங்கள் அவற்றின் கீழே உள்ளன.</desc>
