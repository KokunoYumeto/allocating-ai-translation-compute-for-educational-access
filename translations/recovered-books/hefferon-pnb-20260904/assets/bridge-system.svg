<svg xmlns="http://www.w3.org/2000/svg" width="620" height="420" viewBox="0 0 620 420" role="img" aria-labelledby="title desc"><title id="title">Two linear equations with intersection (4,3)</title><desc id="desc">x+y=7 descends; x-y=1 ascends. Their sole intersection is (4,3). Axes are labeled x and y.</desc><rect width="620" height="420" fill="#fffdf8"/><path d="M60,45 V360" stroke="#d7e0da"/><text x="60" y="385" text-anchor="middle" font-family="sans-serif" font-size="15">0</text><path d="M125,45 V360" stroke="#d7e0da"/><text x="125" y="385" text-anchor="middle" font-family="sans-serif" font-size="15">1</text><path d="M190,45 V360" stroke="#d7e0da"/><text x="190" y="385" text-anchor="middle" font-family="sans-serif" font-size="15">2</text><path d="M255,45 V360" stroke="#d7e0da"/><text x="255" y="385" text-anchor="middle" font-family="sans-serif" font-size="15">3</text><path d="M320,45 V360" stroke="#d7e0da"/><text x="320" y="385" text-anchor="middle" font-family="sans-serif" font-size="15">4</text><path d="M385,45 V360" stroke="#d7e0da"/><text x="385" y="385" text-anchor="middle" font-family="sans-serif" font-size="15">5</text><path d="M450,45 V360" stroke="#d7e0da"/><text x="450" y="385" text-anchor="middle" font-family="sans-serif" font-size="15">6</text><path d="M515,45 V360" stroke="#d7e0da"/><text x="515" y="385" text-anchor="middle" font-family="sans-serif" font-size="15">7</text><path d="M580,45 V360" stroke="#d7e0da"/><text x="580" y="385" text-anchor="middle" font-family="sans-serif" font-size="15">8</text><path d="M60,360 H580" stroke="#d7e0da"/><text x="43" y="365" text-anchor="end" font-family="sans-serif" font-size="15">0</text><path d="M60,315 H580" stroke="#d7e0da"/><text x="43" y="320" text-anchor="end" font-family="sans-serif" font-size="15">1</text><path d="M60,270 H580" stroke="#d7e0da"/><text x="43" y="275" text-anchor="end" font-family="sans-serif" font-size="15">2</text><path d="M60,225 H580" stroke="#d7e0da"/><text x="43" y="230" text-anchor="end" font-family="sans-serif" font-size="15">3</text><path d="M60,180 H580" stroke="#d7e0da"/><text x="43" y="185" text-anchor="end" font-family="sans-serif" font-size="15">4</text><path d="M60,135 H580" stroke="#d7e0da"/><text x="43" y="140" text-anchor="end" font-family="sans-serif" font-size="15">5</text><path d="M60,90 H580" stroke="#d7e0da"/><text x="43" y="95" text-anchor="end" font-family="sans-serif" font-size="15">6</text><path d="M60,45 H580" stroke="#d7e0da"/><text x="43" y="50" text-anchor="end" font-family="sans-serif" font-size="15">7</text><path d="M60,38 V360 H590" fill="none" stroke="#173434" stroke-width="2"/><text x="596" y="366" font-size="20">x</text><text x="51" y="25" font-size="20">y</text><path d="M60,45 L515,360" stroke="#175b94" stroke-width="3" fill="none"/><path d="M125,360 L580,45" stroke="#925312" stroke-width="3" stroke-dasharray="10 6" fill="none"/><circle cx="320" cy="225" r="6" fill="#173434"/><rect x="328" y="213" width="70" height="29" fill="#fffdf8"/><text x="334" y="233" font-family="sans-serif" font-size="18">(4,3)</text><text x="100" y="68" fill="#175b94" font-family="sans-serif" font-size="18">x+y=7</text><text x="445" y="67" fill="#925312" font-family="sans-serif" font-size="18">x-y=1</text></svg>
