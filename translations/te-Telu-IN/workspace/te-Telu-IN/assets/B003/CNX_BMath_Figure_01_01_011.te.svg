  <title id="title">స్థాన విలువల పట్టిక / Place-value chart: 5,278,194</title>
  <desc id="desc">15 స్థానాలు, 5 మూడంకెల సమూహాలు; ఎడమ నుంచి కుడికి / 15 places in five three-digit periods, left to right: వంద ట్రిలియన్లు (Hundred trillions): ఖాళీ / blank; పది ట్రిలియన్లు (Ten trillions): ఖాళీ / blank; ట్రిలియన్లు (Trillions): ఖాళీ / blank; వంద బిలియన్లు (Hundred billions): ఖాళీ / blank; పది బిలియన్లు (Ten billions): ఖాళీ / blank; బిలియన్లు (Billions): ఖాళీ / blank; వంద మిలియన్లు (Hundred millions): ఖాళీ / blank; పది మిలియన్లు (Ten millions): ఖాళీ / blank; మిలియన్లు (Millions): 5; వంద వేలు (Hundred thousands): 2; పదివేలు (Ten thousands): 7; వేలు (Thousands): 8; వందలు (Hundreds): 1; పదులు (Tens): 9; ఒకట్లు (Ones): 4. Blank leading cells are not additional zeros. Each place unit is ten times the next place unit to its right. International scale; million/billion/trillion Telugu spellings are editorial bilingual labels. New code-native redraw, not an altered source JPEG.</desc>
