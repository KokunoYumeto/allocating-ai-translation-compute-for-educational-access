    <rect x="980" y="256" width="240" height="100" fill="#ffffff" stroke="#38767a" stroke-width="1.5" data-role="cell-boundary" />
  </g>
  <g data-role="table-cell" data-row="2" data-col="3" data-response="true">
    <rect x="1220" y="256" width="240" height="100" fill="#ffffff" stroke="#38767a" stroke-width="1.5" data-role="cell-boundary" />
  </g>
  <g data-role="table-cell" data-row="3" data-col="0" data-response="false">
    <rect x="20" y="356" width="720" height="100" fill="#f1f7f8" stroke="#38767a" stroke-width="1.5" data-role="cell-boundary" />
    <text x="38" y="396" font-size="26" fill="#153a4b" text-anchor="start" data-role="objective-te" lang="te">అంకె ఉన్న స్థానాన్ని గుర్తించడం</text>
    <text x="38" y="443" font-size="21" fill="#334e5d" text-anchor="start" data-role="objective-en" lang="en">identify the place value of a digit.</text>
  </g>
  <g data-role="table-cell" data-row="3" data-col="1" data-response="true">
    <rect x="740" y="356" width="240" height="100" fill="#f1f7f8" stroke="#38767a" stroke-width="1.5" data-role="cell-boundary" />
  </g>
  <g data-role="table-cell" data-row="3" data-col="2" data-response="true">
    <rect x="980" y="356" width="240" height="100" fill="#f1f7f8" stroke="#38767a" stroke-width="1.5" data-role="cell-boundary" />
  </g>
  <g data-role="table-cell" data-row="3" data-col="3" data-response="true">
    <rect x="1220" y="356" width="240" height="100" fill="#f1f7f8" stroke="#38767a" stroke-width="1.5" data-role="cell-boundary" />
  </g>
  <g data-role="table-cell" data-row="4" data-col="0" data-response="false">
    <rect x="20" y="456" width="720" height="100" fill="#ffffff" stroke="#38767a" stroke-width="1.5" data-role="cell-boundary" />
    <text x="38" y="487" font-size="26" fill="#153a4b" text-anchor="start" data-role="objective-te" lang="te">స్థాన విలువతో పూర్ణాంకాలను</text>
    <text x="38" y="519" font-size="26" fill="#153a4b" text-anchor="start" data-role="objective-te" lang="te">అక్షరాలలో రాయడం</text>
    <text x="38" y="543" font-size="21" fill="#334e5d" text-anchor="start" data-role="objective-en" lang="en">use place value to name whole numbers.</text>
  </g>
  <g data-role="table-cell" data-row="4" data-col="1" data-response="true">
    <rect x="740" y="456" width="240" height="100" fill="#ffffff" stroke="#38767a" stroke-width="1.5" data-role="cell-boundary" />
