    <rect x="20" y="556" width="720" height="100" fill="#f1f7f8" stroke="#38767a" stroke-width="1.5" data-role="cell-boundary" />
    <text x="38" y="587" font-size="26" fill="#153a4b" text-anchor="start" data-role="objective-te" lang="te">స్థాన విలువతో పూర్ణాంకాలను</text>
    <text x="38" y="619" font-size="26" fill="#153a4b" text-anchor="start" data-role="objective-te" lang="te">అంకెలలో రాయడం</text>
    <text x="38" y="643" font-size="21" fill="#334e5d" text-anchor="start" data-role="objective-en" lang="en">use place value to write whole numbers.</text>
