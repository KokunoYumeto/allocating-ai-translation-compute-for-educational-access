<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="780" viewBox="0 0 1480 780" role="img" aria-labelledby="title desc" lang="te" font-family="Nirmala UI, Noto Sans Telugu, sans-serif">
  <title id="title">స్వీయ పరిశీలన / Self-assessment checklist</title>
  <desc id="desc">స్వీయ పరిశీలన పట్టిక. ఆరు లక్ష్యాలు; మూడు స్వీయ అంచనా ఎంపికలు. మొత్తం 18 ఎంపిక గడులు ఖాళీగా ఉన్నాయి. Self-assessment: six objectives, three confidence options, all 18 response cells blank. Options: Confidently; With some help; No—I don’t get it! Objectives: సహజ సంఖ్యలను, పూర్ణాంకాలను గుర్తించడం / identify counting numbers and whole numbers.; పూర్ణాంకాలకు నమూనాలు చూపడం / model whole numbers.; అంకె ఉన్న స్థానాన్ని గుర్తించడం / identify the place value of a digit.; స్థాన విలువతో పూర్ణాంకాలను అక్షరాలలో రాయడం / use place value to name whole numbers.; స్థాన విలువతో పూర్ణాంకాలను అంకెలలో రాయడం / use place value to write whole numbers.; పూర్ణాంకాలను నిర్దిష్ట స్థానానికి సవరించి రాయడం / round whole numbers.</desc>
  <rect width="1480" height="780" fill="white" />
  <g data-role="table-cell" data-row="0" data-col="0" data-response="false">
    <rect x="20" y="20" width="720" height="136" fill="#d9f0f0" stroke="#38767a" stroke-width="1.5" data-role="cell-boundary" />
    <text x="380.0" y="76" font-size="26" fill="#153a4b" text-anchor="middle" data-role="header-te" lang="te">నేను చేయగలను…</text>
    <text x="380.0" y="118" font-size="20" fill="#334e5d" text-anchor="middle" data-role="header-en" lang="en">I can…</text>
  </g>
  <g data-role="table-cell" data-row="0" data-col="1" data-response="false">
    <rect x="740" y="20" width="240" height="136" fill="#d9f0f0" stroke="#38767a" stroke-width="1.5" data-role="cell-boundary" />
    <text x="860.0" y="76" font-size="26" fill="#153a4b" text-anchor="middle" data-role="header-te" lang="te">నమ్మకంగా</text>
    <text x="860.0" y="118" font-size="20" fill="#334e5d" text-anchor="middle" data-role="header-en" lang="en">Confidently</text>
  </g>
  <g data-role="table-cell" data-row="0" data-col="2" data-response="false">
    <rect x="980" y="20" width="240" height="136" fill="#d9f0f0" stroke="#38767a" stroke-width="1.5" data-role="cell-boundary" />
    <text x="1100.0" y="76" font-size="26" fill="#153a4b" text-anchor="middle" data-role="header-te" lang="te">కొంత సహాయంతో</text>
    <text x="1100.0" y="118" font-size="20" fill="#334e5d" text-anchor="middle" data-role="header-en" lang="en">With some help</text>
  </g>
  <g data-role="table-cell" data-row="0" data-col="3" data-response="false">
    <rect x="1220" y="20" width="240" height="136" fill="#d9f0f0" stroke="#38767a" stroke-width="1.5" data-role="cell-boundary" />
    <text x="1340.0" y="54" font-size="26" fill="#153a4b" text-anchor="middle" data-role="header-te" lang="te">లేదు—ఇంకా</text>
    <text x="1340.0" y="86" font-size="26" fill="#153a4b" text-anchor="middle" data-role="header-te" lang="te">అర్థం కాలేదు!</text>
    <text x="1340.0" y="118" font-size="20" fill="#334e5d" text-anchor="middle" data-role="header-en" lang="en">No—I don’t</text>
    <text x="1340.0" y="140" font-size="20" fill="#334e5d" text-anchor="middle" data-role="header-en" lang="en">get it!</text>
  </g>
  <g data-role="table-cell" data-row="1" data-col="0" data-response="false">
    <rect x="20" y="156" width="720" height="100" fill="#f1f7f8" stroke="#38767a" stroke-width="1.5" data-role="cell-boundary" />
    <text x="38" y="196" font-size="26" fill="#153a4b" text-anchor="start" data-role="objective-te" lang="te">సహజ సంఖ్యలను, పూర్ణాంకాలను గుర్తించడం</text>
    <text x="38" y="243" font-size="21" fill="#334e5d" text-anchor="start" data-role="objective-en" lang="en">identify counting numbers and whole numbers.</text>
  </g>
  <g data-role="table-cell" data-row="1" data-col="1" data-response="true">
    <rect x="740" y="156" width="240" height="100" fill="#f1f7f8" stroke="#38767a" stroke-width="1.5" data-role="cell-boundary" />
  </g>
  <g data-role="table-cell" data-row="1" data-col="2" data-response="true">
    <rect x="980" y="156" width="240" height="100" fill="#f1f7f8" stroke="#38767a" stroke-width="1.5" data-role="cell-boundary" />
  </g>
  <g data-role="table-cell" data-row="1" data-col="3" data-response="true">
    <rect x="1220" y="156" width="240" height="100" fill="#f1f7f8" stroke="#38767a" stroke-width="1.5" data-role="cell-boundary" />
  </g>
  <g data-role="table-cell" data-row="2" data-col="0" data-response="false">
    <rect x="20" y="256" width="720" height="100" fill="#ffffff" stroke="#38767a" stroke-width="1.5" data-role="cell-boundary" />
    <text x="38" y="296" font-size="26" fill="#153a4b" text-anchor="start" data-role="objective-te" lang="te">పూర్ణాంకాలకు నమూనాలు చూపడం</text>
    <text x="38" y="343" font-size="21" fill="#334e5d" text-anchor="start" data-role="objective-en" lang="en">model whole numbers.</text>
  </g>
  <g data-role="table-cell" data-row="2" data-col="1" data-response="true">
    <rect x="740" y="256" width="240" height="100" fill="#ffffff" stroke="#38767a" stroke-width="1.5" data-role="cell-boundary" />
