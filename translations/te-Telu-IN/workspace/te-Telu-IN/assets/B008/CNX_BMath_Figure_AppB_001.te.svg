    <rect x="20" y="656" width="720" height="100" fill="#ffffff" stroke="#38767a" stroke-width="1.5" data-role="cell-boundary" />
    <text x="38" y="687" font-size="26" fill="#153a4b" text-anchor="start" data-role="objective-te" lang="te">పూర్ణాంకాలను నిర్దిష్ట స్థానానికి</text>
    <text x="38" y="719" font-size="26" fill="#153a4b" text-anchor="start" data-role="objective-te" lang="te">సవరించి రాయడం</text>
    <text x="38" y="743" font-size="21" fill="#334e5d" text-anchor="start" data-role="objective-en" lang="en">round whole numbers.</text>
  </g>
