<svg xmlns="http://www.w3.org/2000/svg" width="740" height="170" viewBox="0 0 740 170" role="img" aria-labelledby="title desc">
  <title id="title">సంఖ్యారేఖ — Number line</title>
  <desc id="desc">0 నుంచి 6 వరకు ఒక ప్రమాణం దూరంతో గుర్తులు. కుడివైపు సంఖ్యలు పెరుగుతాయి; ఎడమవైపు తగ్గుతాయి.</desc>
  <rect width="740" height="170" fill="white"/>
  <g stroke="#174a61" stroke-width="3" fill="none">
    <path d="M40 100H700M40 100l12 -7M40 100l12 7M700 100l-12 -7M700 100l-12 7"/>
    <path d="M70 90v20M170 90v20M270 90v20M370 90v20M470 90v20M570 90v20M670 90v20"/>
    <path d="M110 40H290M110 40l12 -7M110 40l12 7M450 40H630M630 40l-12 -7M630 40l-12 7"/>
  </g>
  <g font-family="Nirmala UI, Noto Sans Telugu, sans-serif" text-anchor="middle" fill="#123042">
    <text x="200" y="24" font-size="18">చిన్నవి · smaller</text><text x="540" y="24" font-size="18">పెద్దవి · larger</text>
    <text x="70" y="142" font-size="23">0</text><text x="170" y="142" font-size="23">1</text><text x="270" y="142" font-size="23">2</text><text x="370" y="142" font-size="23">3</text><text x="470" y="142" font-size="23">4</text><text x="570" y="142" font-size="23">5</text><text x="670" y="142" font-size="23">6</text>
  </g>
</svg>
