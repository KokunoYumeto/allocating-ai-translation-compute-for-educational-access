<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc" lang="te" font-family="Nirmala UI, Noto Sans Telugu, sans-serif" data-number="37,519,248" data-period-count="3">
  <title id="title">మూడంకెల సమూహాలు / Three-digit periods: 37,519,248</title>
  <desc id="desc">37: మిలియన్లు (millions); English: Thirty-seven million; తెలుగు అర్థం: ముప్పై ఏడు మిలియన్లు; 519: వేలు (thousands); English: Five hundred nineteen thousand; తెలుగు అర్థం: ఐదు వందల పందొమ్మిది వేలు; 248: ఒకట్లు (ones); English: Two hundred forty-eight; తెలుగు అర్థం: రెండు వందల నలభై ఎనిమిది. International grouping preserved. One arrow connects each digit group with its English number-name chunk and separate Telugu gloss. English named scales use singular words; this is not a Telugu suffix-removal rule. Million/billion/trillion Telugu loanwords are editorial. New code-native redraw; original JPEG unchanged.</desc>
  <rect width="1280" height="660" fill="white" />
  <text x="40" y="42" font-size="28" fill="#153a4b" text-anchor="start">మూడంకెల సమూహాలు / periods</text>
  <text x="1240" y="42" font-size="28" fill="#153a4b" text-anchor="end" data-role="number-caption">37,519,248</text>
