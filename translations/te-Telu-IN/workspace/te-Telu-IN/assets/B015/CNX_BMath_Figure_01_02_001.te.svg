<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 304" width="1260" height="304" role="img" aria-labelledby="title desc" lang="te"><title id="title">17 + 26: నమూనా, నిలువు సంకలనం (model and column addition)</title><desc id="desc">17 + 26 నమూనా (model): ఎడమ పై భాగంలో పదుల కడ్డీ 1, ఒకట్ల బ్లాకులు 7 (2 + 5); ఎడమ కింది భాగంలో పదుల కడ్డీలు 2, ఒకట్ల బ్లాకులు 6 (5 + 1). కుడివైపు పదుల కడ్డీలు 4, ఒకట్ల బ్లాకులు 3. ఒక్కో కడ్డీలో 10 గడులు; ఒక్కో విడి బ్లాకు విలువ 1. బాణం ఎడమ నమూనా నుంచి కుడి నమూనాకు చూపుతుంది. కుడి అంచున 17 + 26 = 43 నిలువుగా రాయబడింది; పదుల అంకె 1 పైన చిన్న ఎరుపు 1 ఉంది. 1 + 1 + 2 = 4 అనే పెట్టె నుంచి ఆ చిన్న 1 వైపు మరో బాణం చూపుతుంది. English: 17 (one ten and seven ones) plus 26 (two tens and six ones) becomes four tens and three ones; the adjacent column sum is 43 with a red carry 1 over the tens digit. Callout: 1 + 1 + 2 = 4.</desc><metadata>New code-native mathematical redraw of the pinned OpenStax image; original raster retained unchanged. Not a scan edit, official Telugu terminology claim, or native-speaker approval.</metadata><rect x="0" y="0" width="1260" height="304" fill="#ffffff" data-role="background" /><g data-role="block-group" data-kind="ten" data-stage="before-17" data-group="a-ten"><rect x="70" y="76" width="22" height="22" fill="#e1f0f2" stroke="#245868" stroke-width="1.6" data-role="unit-cell" /><rect x="92" y="76" width="22" height="22" fill="#e1f0f2" stroke="#245868" stroke-width="1.6" data-role="unit-cell" /><rect x="114" y="76" width="22" height="22" fill="#e1f0f2" stroke="#245868" stroke-width="1.6" data-role="unit-cell" /><rect x="136" y="76" width="22" height="22" fill="#e1f0f2" stroke="#245868" stroke-width="1.6" data-role="unit-cell" /><rect x="158" y="76" width="22" height="22" fill="#e1f0f2" stroke="#245868" stroke-width="1.6" data-role="unit-cell" /><rect x="180" y="76" width="22" height="22" fill="#e1f0f2" stroke="#245868" stroke-width="1.6" data-role="unit-cell" /><rect x="202" y="76" width="22" height="22" fill="#e1f0