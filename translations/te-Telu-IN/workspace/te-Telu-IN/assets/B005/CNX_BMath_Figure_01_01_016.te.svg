  <text x="440" y="501" font-size="34" fill="#153a4b" text-anchor="middle" data-role="number-comma" data-after="0">,</text>
  <text x="440" y="212" font-size="30" fill="#153a4b" text-anchor="middle" data-role="phrase-comma" data-after="0">,</text>
