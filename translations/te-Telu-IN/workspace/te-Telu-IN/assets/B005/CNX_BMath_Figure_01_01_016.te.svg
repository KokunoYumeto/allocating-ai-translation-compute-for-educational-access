    <text x="240" y="501" font-size="38" fill="#153a4b" text-anchor="middle" data-role="digit" data-slot="1">5</text>
    <line x1="222" x2="258" y1="516" y2="516" stroke="#153a4b" stroke-width="2" data-role="digit-slot" data-slot="1" />
    <text x="290" y="501" font-size="38" fill="#153a4b" text-anchor="middle" data-role="digit" data-slot="2">3</text>
    <line x1="272" x2="308" y1="516" y2="516" stroke="#153a4b" stroke-width="2" data-role="digit-slot" data-slot="2" />
    <text x="240" y="552" font-size="20" fill="#426271" text-anchor="middle">అంకెలకు స్థానాలు / digit places</text>
  </g>
