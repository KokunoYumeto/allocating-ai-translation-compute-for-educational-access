<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc" lang="te" font-family="Nirmala UI, Noto Sans Telugu, sans-serif" data-number="53,401,742" data-period-count="3">
  <title id="title">పేర్ల నుంచి అంకెలకు / Words to digits: 53,401,742</title>
  <desc id="desc">మిలియన్లు (millions): English fifty-three million; తెలుగు అర్థం యాభై మూడు మిలియన్లు; downward arrow to 53 in three digit positions; వేలు (thousands): English four hundred one thousand; తెలుగు అర్థం నాలుగు వందల ఒక వేలు; downward arrow to 401 in three digit positions; ఒకట్లు (ones): English seven hundred forty-two; తెలుగు అర్థం ఏడు వందల నలభై రెండు; downward arrow to 742 in three digit positions. Empty leading positions in the first period stay blank, not zero. Later periods keep all three digits, including zeros. English source phrases are preserved; Telugu glosses are separate editorial wording, not an English suffix rule. New code-native redraw; original JPEG unchanged. International comma grouping retained.</desc>
  <rect width="1280" height="660" fill="white" />
  <text x="40" y="42" font-size="26" fill="#153a4b" text-anchor="start">పేర్ల నుంచి అంకెలకు / words → digits</text>
  <text x="1240" y="42" font-size="27" fill="#153a4b" text-anchor="end" data-role="number-caption">53,401,742</text>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#006b67" />
    </marker>
  </defs>
  <g id="period-0" data-role="period" data-index="0" data-digits="53" data-power="6">
    <rect x="48" y="65" width="384" height="300" rx="10" fill="#eef8f5" stroke="#b5d8d2" />
    <text x="240" y="102" font-size="26" fill="#006b67" text-anchor="middle" data-role="period-name-te">మిలియన్లు</text>
    <text x="240" y="134" font-size="22" fill="#006b67" text-anchor="middle" lang="en" data-role="period-name-en">millions</text>
    <text x="240" y="176" font-size="18" fill="#426271" text-anchor="middle" lang="en" data-role="english-caption">English</text>
    <text x="240" y="212" font-size="23" fill="#153a4b" text-anchor="middle" lang="en" data-role="english-name">fifty-three million</text>
    <text x="240" y="280" font-size="18" fill="#426271" text-anchor="middle" data-role="gloss-caption">తెలుగు అర్థం / gloss</text>
    <text x="240" y="316" font-size="25" fill="#153a4b" text-anchor="middle" data-role="telugu-gloss">యాభై మూడు మిలియన్లు</text>
  </g>
  <g id="digits-0" data-role="digit-output" data-index="0">
