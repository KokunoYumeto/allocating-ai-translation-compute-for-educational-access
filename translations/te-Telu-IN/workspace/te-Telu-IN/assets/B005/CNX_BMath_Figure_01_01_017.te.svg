  <title id="title">పేర్ల నుంచి అంకెలకు / Words to digits: 9,246,073,189</title>
  <desc id="desc">బిలియన్లు (billions): English nine billion; తెలుగు అర్థం తొమ్మిది బిలియన్లు; downward arrow to 9 in three digit positions; మిలియన్లు (millions): English two hundred forty-six million; తెలుగు అర్థం రెండు వందల నలభై ఆరు మిలియన్లు; downward arrow to 246 in three digit positions; వేలు (thousands): English seventy-three thousand; తెలుగు అర్థం డెబ్బై మూడు వేలు; downward arrow to 073 in three digit positions; ఒకట్లు (ones): English one hundred eighty-nine; తెలుగు అర్థం నూట ఎనభై తొమ్మిది; downward arrow to 189 in three digit positions. Empty leading positions in the first period stay blank, not zero. Later periods keep all three digits, including zeros. English source phrases are preserved; Telugu glosses are separate editorial wording, not an English suffix rule. Source017 alt text erroneously says742; inspected original JPEG and source answer show073. New code-native redraw; original JPEG unchanged. International comma grouping retained.</desc>
