<svg xmlns="http://www.w3.org/2000/svg" width="740" height="420" viewBox="0 0 740 420" role="img" aria-labelledby="title desc" lang="te" font-family="Nirmala UI, Noto Sans Telugu, sans-serif" data-source-suffix="214_img"><title id="title">చుట్టుకొలత సాధన ఆకారం / Perimeter practice figure</title><desc id="desc">మూసుకున్న ఆకారపు అంచులపై కనిపించే పొడవులు: 24 ft, 7 ft, 19 ft, 3 ft, 5 ft, 4 ft. ప్రతి అంచును ఒకసారి కలపాలి. Closed figure with visible boundary labels: 24 ft, 7 ft, 19 ft, 3 ft, 5 ft, 4 ft. Add every boundary edge once. The perimeter answer is not shown.</desc><metadata>New code-native mathematical redraw of one pinned OpenStax source image; the original raster is retained unchanged.</metadata><rect x="0" y="0" width="740" height="420" fill="#ffffff" data-role="background" /><polygon points="80,80 650,80 650,290 210,290 210,200 80,200" fill="#e9f5f2" stroke="#287a82" stroke-width="4" stroke-linejoin="round" data-role="boundary" data-edge-count="6" data-visible-lengths="24,7,19,3,5,4" data-derived-unlabeled-length="" data-unit="ft" /><text x="365" y="60" text-anchor="middle" font-size="25" fill="#173b4d" data-role="side-label" data-label-index="1">24 ft</text><text x="690" y="190" text-anchor="middle" font-size="25" fill="#173b4d" data-role="side-label" data-label-index="2">7 ft</text><text x="430" y="330" text-anchor="middle" font-size="25" fill="#173b4d" data-role="side-label" data-label-index="3">19 ft</text><text x="250" y="255" text-anchor="middle" font-size="25" fill="#173b4d" data-role="side-label" data-label-index="4">3 ft</text><text x="145" y="230" text-anchor="middle" font-size="25" fill="#173b4d" data-role="side-label" data-label-index="5">5 ft</text><text x="45" y="145" text-anchor="middle" font-size="25" fill="#173b4d" data-role="side-label" data-label-index="6">4 ft</text><text x="370.0" y="402" text-anchor="middle" font-size="20" fill="#526b78" data-role="unit-key">ft = అడుగులు</text></svg>
