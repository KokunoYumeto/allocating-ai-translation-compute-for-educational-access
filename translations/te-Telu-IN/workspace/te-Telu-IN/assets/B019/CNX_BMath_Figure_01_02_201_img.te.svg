<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc" lang="te" font-family="Nirmala UI, Noto Sans Telugu, sans-serif" data-source-suffix="201_img"><title id="title">పూర్ణాంకాల సంకలన బ్లాకుల నమూనా / Whole-number addition block model</title><desc id="desc">2 + 4 కోసం బ్లాకుల నమూనా. కనిపించే సమూహాలు: 2 ones; 4 ones. Block model for 2 + 4; visible groups: 2 ones; 4 ones. The numerical equation is not printed in this redraw.</desc><metadata>New code-native mathematical redraw of one pinned OpenStax source image; the original raster is retained unchanged.</metadata><rect x="0" y="0" width="760" height="360" fill="#ffffff" data-role="background" /><text x="380.0" y="42" text-anchor="middle" font-size="25" fill="#173b4d" data-role="heading">సంకలన బ్లాకుల నమూనా · Addition block model</text><g data-role="model-group" data-group="1" data-kind="ones" data-count="2" data-value="2"><rect x="170" y="145" width="24" height="24" fill="#c5dce5" stroke="#496f7d" stroke-width="1.2" data-unit-cell="0" data-item="0" /><rect x="208" y="145" width="24" height="24" fill="#c5dce5" stroke="#496f7d" stroke-width="1.2" data-unit-cell="0" data-item="1" /></g><g data-role="model-group" data-group="2" data-kind="ones" data-count="4" data-value="4"><rect x="400" y="145" width="24" height="24" fill="#c5dce5" stroke="#496f7d" stroke-width="1.2" data-unit-cell="0" data-item="0" /><rect x="438" y="145" width="24" height="24" fill="#c5dce5" stroke="#496f7d" stroke-width="1.2" data-unit-cell="0" data-item="1" /><rect x="476" y="145" width="24" height="24" fill="#c5dce5" stroke="#496f7d" stroke-width="1.2" data-unit-cell="0" data-item="2" /><rect x="514" y="145" width="24" height="24" fill="#c5dce5" stroke="#496f7d" stroke-width="1.2" data-unit-cell="0" data-item="3" /></g><text x="380.0" y="340" text-anchor="middle" font-size="20" fill="#526b78" data-role="unit-key">ఒక చిన్న గడి విలువ 1; పది గడుల కడ్డీ విలువ 10 · one cell = 1; one 