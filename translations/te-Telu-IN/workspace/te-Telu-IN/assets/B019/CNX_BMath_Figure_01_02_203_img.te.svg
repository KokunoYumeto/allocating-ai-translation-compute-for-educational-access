<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc" lang="te" font-family="Nirmala UI, Noto Sans Telugu, sans-serif" data-source-suffix="203_img"><title id="title">పూర్ణాంకాల సంకలన బ్లాకుల నమూనా / Whole-number addition block model</title><desc id="desc">8 + 4 కోసం బ్లాకుల నమూనా. కనిపించే సమూహాలు: 1 tens; 2 ones. Block model for 8 + 4; visible groups: 1 tens; 2 ones. The numerical equation is not printed in this redraw.</desc><metadata>New code-native mathematical redraw of one pinned OpenStax source image; the original raster is retained unchanged.</metadata><rect x="0" y="0" width="760" height="360" fill="#ffffff" data-role="background" /><text x="380.0" y="42" text-anchor="middle" font-size="25" fill="#173b4d" data-role="heading">సంకలన బ్లాకుల నమూనా · Addition block model</text><g data-role="model-group" data-group="1" data-kind="tens" data-count="1" data-value="10"><rect x="120" y="145" width="24" height="24" fill="#c5dce5" stroke="#496f7d" stroke-width="1.2" data-unit-cell="0" data-item="0" /><rect x="144" y="145" width="24" height="24" fill="#c5dce5" stroke="#496f7d" stroke-width="1.2" data-unit-cell="1" data-item="0" /><rect x="168" y="145" width="24" height="24" fill="#c5dce5" stroke="#496f7d" stroke-width="1.2" data-unit-cell="2" data-item="0" /><rect x="192" y="145" width="24" height="24" fill="#c5dce5" stroke="#496f7d" stroke-width="1.2" data-unit-cell="3" data-item="0" /><rect x="216" y="145" width="24" height="24" fill="#c5dce5" stroke="#496f7d" stroke-width="1.2" data-unit-cell="4" data-item="0" /><rect x="240" y="145" width="24" height="24" fill="#c5dce5" stroke="#496f7d" stroke-width="1.2" data-unit-cell="5" data-item="0" /><rect x="264" y="145" width="24" height="24" fill="#c5dce5" stroke="#496f7d" stroke-width="1.2" data-unit-cell="6" data-item="0" /><rect x="288" y="145" width="24" height="24" fill="#c5dce5" stroke="#496f7d" stroke-width="1.2" data-unit-cell="7" data-item="0" /><rect x="312" y="145" width="24" height="24" fill="#c5dce5" stroke="#496f7d" stroke-width="1.2" data-unit-cell="8" data-item="0" /><rect x="336" y="145" width="24" height="24" fill="#c5dce5" stroke="#496f7d" stroke-width="1.2" data-unit-cell="9" data-item="0" /></g><g data-role="model-group" data-group="2" data-kind="ones" data-count="2" data-value="2"><rect x="520" y="145" width="24" height="24" fill="#c5dce5" stroke="#496f7d" stroke-width="1.2" data-unit-cell="0" data-item="0" /><rect x="558" y="145" width="24" height="24" fill="#c5dce5" stroke="#496f7d" stroke-width="1.2" data-unit-cell="0" data-item="1" /></g><text x="380.0" y="340" text-anchor="middle" font-size="20" fill="#526b78" data-role="unit-key">ఒక చిన్న గడి విలువ 1; పది గడుల కడ్డీ విలువ 10 · one cell = 1; one rod = 10</text></svg>
