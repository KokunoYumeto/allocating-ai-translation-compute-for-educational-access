<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="680" viewBox="0 0 1480 680" role="img" aria-labelledby="title desc" lang="te" font-family="Nirmala UI, Noto Sans Telugu, sans-serif" data-source-suffix="AppB_002_A"><title id="title">స్వీయ పరిశీలన / Self-assessment checklist</title><desc id="desc">స్వీయ పరిశీలన పట్టిక. ఐదు లక్ష్యాలు; మూడు స్వీయ అంచనా ఎంపికలు; మొత్తం 15 ఎంపిక గడులు ఖాళీగా ఉన్నాయి. Self-assessment: five objectives, three confidence options, all 15 response cells blank. Objectives: సంకలనాన్ని చిహ్నాలతో రాయగలను. / use addition notation.; పూర్ణాంకాల సంకలనాన్ని నమూనాలతో చూపగలను. / model addition of whole numbers.; నమూనాలు లేకుండా పూర్ణాంకాలను కలపగలను. / add whole numbers without models.; మాటల్లో ఇచ్చినదాన్ని గణిత సంకేతాలతో రాయగలను. / translate word phrases to math notation.; జీవిత సందర్భాల సమస్యల్లో పూర్ణాంకాలను కలపగలను. / add whole numbers in applications.</desc><metadata>New code-native mathematical redraw of one pinned OpenStax source image; the original raster is retained unchanged.</metadata><rect x="0" y="0" width="1480" height="680" fill="#ffffff" data-role="background" /><g data-role="table-cell" data-row="0" data-col="0" data-response="false"><rect x="20" y="20" width="720" height="136" fill="#acdadd" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /><text x="380.0" y="76" text-anchor="middle" font-size="26" fill="#173b4d" data-role="header-te" lang="te">నేను చేయగలను…</text><text x="380.0" y="118" text-anchor="middle" font-size="20" fill="#334e5d" data-role="header-en" lang="en">I can…</text></g><g data-role="table-cell" data-row="0" data-col="1" data-response="false"><rect x="740" y="20" width="240" height="136" fill="#acdadd" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /><text x="860.0" y="76" text-anchor="middle" font-size="26" fill="#173b4d" data-role="header-te" lang="te">నమ్మకంగా</text><text x="860.0" y="118" text-anchor="middle" font-size="20" fill="#334e5d" data-role="header-en" lang="en">Confidently</text></g><g data-role="table-cell" data-row="0" data-col="2" data-response="false"><rect x="980" y="20" width="240" height="136" fill="#acdadd" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /><text x="1100.0" y="76" text-anchor="middle" font-size="26" fill="#173b4d" data-role="header-te" lang="te">కొంత సహాయంతో</text><text x="1100.0" y="118" text-anchor="middle" font-size="20" fill="#334e5d" data-role="header-en" lang="en">With some help</text></g><g data-role="table-cell" data-row="0" data-col="3" data-response="false"><rect x="1220" y="20" width="240" height="136" fill="#acdadd" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /><text x="1340.0" y="54" text-anchor="middle" font-size="26" fill="#173b4d" data-role="header-te" lang="te">లేదు—ఇంకా</text><text x="1340.0" y="86" text-anchor="middle" font-size="26" fill="#173b4d" data-role="header-te" lang="te">అర్థం కాలేదు!</text><text x="1340.0" y="118" text-anchor="middle" font-size="20" fill="#334e5d" data-role="header-en" lang="en">No—I don’t</text><text x="1340.0" y="140" text-anchor="middle" font-size="20" fill="#334e5d" data-role="header-en" lang="en">get it!</text></g><g data-role="table-cell" data-row="1" data-col="0" data-response="false"><rect x="20" y="156" width="720" height="100" fill="#eef8f8" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /><text x="38" y="196" text-anchor="start" font-size="25" fill="#173b4d" data-role="objective-te" lang="te">సంకలనాన్ని చిహ్నాలతో రాయగలను.</text><text x="38" y="243" text-anchor="start" font-size="20" fill="#334e5d" data-role="objective-en" lang="en">use addition notation.</text></g><g data-role="table-cell" data-row="1" data-col="1" data-response="true"><rect x="740" y="156" width="240" height="100" fill="#eef8f8" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /></g><g data-role="table-cell" data-row="1" data-col="2" data-response="true"><rect x="980" y="156" width="240" height="100" fill="#eef8f8" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /></g><g data-role="table-cell" data-row="1" data-col="3" data-response="true"><rect x="1220" y="156" width="240" height="100" fill="#eef8f8" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /></g><g data-role="table-cell" data-row="2" data-col="0" data-response="false"><rect x="20" y="256" width="720" height="100" fill="#ffffff" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /><text x="38" y="296" text-anchor="start" font-size="25" fill="#173b4d" data-role="objective-te" lang="te">పూర్ణాంకాల సంకలనాన్ని నమూనాలతో చూపగలను.</text><text x="38" y="343" text-anchor="start" font-size="20" fill="#334e5d" data-role="objective-en" lang="en">model addition of whole numbers.</text></g><g data-role="table-cell" data-row="2" data-col="1" data-response="true"><rect x="740" y="256" width="240" height="100" fill="#ffffff" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /></g><g data-role="table-cell" data-row="2" data-col="2" data-response="true"><rect x="980" y="256" width="240" height="100" fill="#ffffff" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /></g><g data-role="table-cell" data-row="2" data-col="3" data-response="true"><rect x="1220" y="256" width="240" height="100" fill="#ffffff" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /></g><g data-role="table-cell" data-row="3" data-col="0" data-response="false"><rect x="20" y="356" width="720" height="100" fill="#eef8f8" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /><text x="38" y="396" text-anchor="start" font-size="25" fill="#173b4d" data-role="objective-te" lang="te">నమూనాలు లేకుండా పూర్ణాంకాలను కలపగలను.</text><text x="38" y="443" text-anchor="start" font-size="20" fill="#334e5d" data-role="objective-en" lang="en">add whole numbers without models.</text></g><g data-role="table-cell" data-row="3" data-col="1" data-response="true"><rect x="740" y="356" width="240" height="100" fill="#eef8f8" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /></g><g data-role="table-cell" data-row="3" data-col="2" data-response="true"><rect x="980" y="356" width="240" height="100" fill="#eef8f8" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /></g><g data-role="table-cell" data-row="3" data-col="3" data-response="true"><rect x="1220" y="356" width="240" height="100" fill="#eef8f8" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /></g><g data-role="table-cell" data-row="4" data-col="0" data-response="false"><rect x="20" y="456" width="720" height="100" fill="#ffffff" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /><text x="38" y="496" text-anchor="start" font-size="25" fill="#173b4d" data-role="objective-te" lang="te">మాటల్లో ఇచ్చినదాన్ని గణిత సంకేతాలతో రాయగలను.</text><text x="38" y="543" text-anchor="start" font-size="20" fill="#334e5d" data-role="objective-en" lang="en">translate word phrases to math notation.</text></g><g data-role="table-cell" data-row="4" data-col="1" data-response="true"><rect x="740" y="456" width="240" height="100" fill="#ffffff" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /></g><g data-role="table-cell" data-row="4" data-col="2" data-response="true"><rect x="980" y="456" width="240" height="100" fill="#ffffff" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /></g><g data-role="table-cell" data-row="4" data-col="3" data-response="true"><rect x="1220" y="456" width="240" height="100" fill="#ffffff" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /></g><g data-role="table-cell" data-row="5" data-col="0" data-response="false"><rect x="20" y="556" width="720" height="100" fill="#eef8f8" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /><text x="38" y="596" text-anchor="start" font-size="25" fill="#173b4d" data-role="objective-te" lang="te">జీవిత సందర్భాల సమస్యల్లో పూర్ణాంకాలను కలపగలను.</text><text x="38" y="643" text-anchor="start" font-size="20" fill="#334e5d" data-role="objective-en" lang="en">add whole numbers in applications.</text></g><g data-role="table-cell" data-row="5" data-col="1" data-response="true"><rect x="740" y="556" width="240" height="100" fill="#eef8f8" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /></g><g data-role="table-cell" data-row="5" data-col="2" data-response="true"><rect x="980" y="556" width="240" height="100" fill="#eef8f8" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /></g><g data-role="table-cell" data-row="5" data-col="3" data-response="true"><rect x="1220" y="556" width="240" height="100" fill="#eef8f8" stroke="#287a82" stroke-width="1.5" data-role="cell-boundary" /></g></svg>
