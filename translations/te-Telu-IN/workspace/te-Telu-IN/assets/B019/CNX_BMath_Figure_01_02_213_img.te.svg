<svg xmlns="http://www.w3.org/2000/svg" width="740" height="420" viewBox="0 0 740 420" role="img" aria-labelledby="title desc" lang="te" font-family="Nirmala UI, Noto Sans Telugu, sans-serif" data-source-suffix="213_img"><title id="title">చుట్టుకొలత సాధన ఆకారం / Perimeter practice figure</title><desc id="desc">మూసుకున్న ఆకారపు అంచులపై కనిపించే పొడవులు: 24 m, 17 m, 29 m, 17 m. ప్రతి అంచును ఒకసారి కలపాలి. Closed figure with visible boundary labels: 24 m, 17 m, 29 m, 17 m. Add every boundary edge once. The perimeter answer is not shown.</desc><metadata>New code-native mathematical redraw of one pinned OpenStax source image; the original raster is retained unchanged.</metadata><rect x="0" y="0" width="740" height="420" fill="#ffffff" data-role="background" /><polygon points="220,70 500,70 610,320 110,320" fill="#e9f5f2" stroke="#287a82" stroke-width="4" stroke-linejoin="round" data-role="boundary" data-edge-count="4" data-visible-lengths="24,17,29,17" data-derived-unlabeled-length="" data-unit="m" /><text x="360" y="50" text-anchor="middle" font-size="25" fill="#173b4d" data-role="side-label" data-label-index="1">24 m</text><text x="650" y="190" text-anchor="middle" font-size="25" fill="#173b4d" data-role="side-label" data-label-index="2">17 m</text><text x="360" y="360" text-anchor="middle" font-size="25" fill="#173b4d" data-role="side-label" data-label-index="3">29 m</text><text x="75" y="190" text-anchor="middle" font-size="25" fill="#173b4d" data-role="side-label" data-label-index="4">17 m</text><text x="370.0" y="402" text-anchor="middle" font-size="20" fill="#526b78" data-role="unit-key">m = మీటర్లు</text></svg>
