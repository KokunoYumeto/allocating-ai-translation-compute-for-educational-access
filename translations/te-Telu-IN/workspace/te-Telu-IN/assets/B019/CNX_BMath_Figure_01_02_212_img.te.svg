<svg xmlns="http://www.w3.org/2000/svg" width="740" height="420" viewBox="0 0 740 420" role="img" aria-labelledby="title desc" lang="te" font-family="Nirmala UI, Noto Sans Telugu, sans-serif" data-source-suffix="212_img"><title id="title">చుట్టుకొలత సాధన ఆకారం / Perimeter practice figure</title><desc id="desc">మూసుకున్న ఆకారపు అంచులపై కనిపించే పొడవులు: 19 yd, 18 yd, 16 yd, 18 yd. ప్రతి అంచును ఒకసారి కలపాలి. Closed figure with visible boundary labels: 19 yd, 18 yd, 16 yd, 18 yd. Add every boundary edge once. The perimeter answer is not shown.</desc><metadata>New code-native mathematical redraw of one pinned OpenStax source image; the original raster is retained unchanged.</metadata><rect x="0" y="0" width="740" height="420" fill="#ffffff" data-role="background" /><polygon points="210,70 510,70 580,330 140,330" fill="#e9f5f2" stroke="#287a82" stroke-width="4" stroke-linejoin="round" data-role="boundary" data-edge-count="4" data-visible-lengths="19,18,16,18" data-derived-unlabeled-length="" data-unit="yd" /><text x="360" y="50" text-anchor="middle" font-size="25" fill="#173b4d" data-role="side-label" data-label-index="1">19 yd</text><text x="630" y="195" text-anchor="middle" font-size="25" fill="#173b4d" data-role="side-label" data-label-index="2">18 yd</text><text x="360" y="370" text-anchor="middle" font-size="25" fill="#173b4d" data-role="side-label" data-label-index="3">16 yd</text><text x="90" y="195" text-anchor="middle" font-size="25" fill="#173b4d" data-role="side-label" data-label-index="4">18 yd</text><text x="370.0" y="402" text-anchor="middle" font-size="20" fill="#526b78" data-role="unit-key">yd = గజాలు</text></svg>
