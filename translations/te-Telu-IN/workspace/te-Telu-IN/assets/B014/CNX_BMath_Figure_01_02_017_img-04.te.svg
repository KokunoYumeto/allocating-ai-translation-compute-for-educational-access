<svg xmlns="http://www.w3.org/2000/svg" width="688" height="220" viewBox="0 0 688 220" role="img" aria-labelledby="title desc" lang="te"><title id="title">సంకలనం: బ్లాకుల నమూనా · Addition block model</title><desc id="desc">ఒక చిన్న గడి విలువ 1; పది గడుల కడ్డీ విలువ 10. ముందు (before): పదుల కడ్డీలు (tens rods) 0; ఒకట్ల బ్లాకులు (ones) 5 + 5 + 3. తర్వాత (after): పదుల కడ్డీలు (tens rods) 1; ఒకట్ల బ్లాకులు (ones) 3. పది ఒకట్లను ఒక పదిగా మార్చినా మొత్తం విలువ మారదు. Both stages represent 13; do not add the two stages.</desc><rect x="0" y="0" width="688" height="220" fill="#ffffff" data-role="background" /><g data-kind="ones" data-count="5" data-stage="before" id="blocks-0"><rect x="28" y="30" width="24" height="24" fill="#e1f0f2" stroke="#245868" stroke-width="1.5" data-cell="0" /><rect x="60" y="30" width="24" height="24" fill="#e1f0f2" stroke="#245868" stroke-width="1.5" data-cell="1" /><rect x="92" y="30" width="24" height="24" fill="#e1f0f2" stroke="#245868" stroke-width="1.5" data-cell="2" /><rect x="124" y="30" width="24" height="24" fill="#e1f0f2" stroke="#245868" stroke-width="1.5" data-cell="3" /><rect x="156" y="30" width="24" height="24" fill="#e1f0f2" stroke="#245868" stroke-width="1.5" data-cell="4" /></g><g data-kind="ones" data-count="5" data-stage="before" id="blocks-1"><rect x="220" y="30" width="24" height="24" fill="#e1f0f2" stroke="#245868" stroke-width="1.5" data-cell="0" /><rect x="252" y="30" width="24" height="24" fill="#e1f0f2" stroke="#245868" stroke-width="1.5" data-cell="1" /><rect x="284" y="30" width="24" height="24" fill="#e1f0f2" stroke="#245868" stroke-width="1.5" data-cell="2" /><rect x="316" y="30" width="24" height="24" fill="#e1f0f2" stroke="#245868" stroke-width="1.5" data-cell="3" /><rect x="348" y="30" width="24" height="24" fill="#e1f0f2" stroke="#245868" stroke-width="1.5" data-cell="4" /></g><g data-kind="ones" data-count="3" data-stage="before" id="blocks-2"><rect x="444" y="30" width="24" height="24" fill="#e1f0f2" stroke="#24