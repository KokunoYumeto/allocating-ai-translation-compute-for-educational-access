<svg xmlns="http://www.w3.org/2000/svg" width="560" height="116" viewBox="0 0 560 116" role="img" aria-labelledby="title desc" lang="te"><title id="title">సంకలనం: బ్లాకుల నమూనా · Addition block model</title><desc id="desc">ఒక చిన్న గడి విలువ 1; పది గడుల కడ్డీ విలువ 10. నమూనా (model): పదుల కడ్డీలు (tens rods) 0; ఒకట్ల బ్లాకులు (ones) 3 + 6. అంకెల గుర్తులు (numeric labels): 3 + 6 = 9.</desc><rect x="0" y="0" width="560" height="116" fill="#ffffff" data-role="background" /><g data-kind="ones" data-count="3" data-stage="single" id="blocks-0"><rect x="28" y="24" width="24" height="24" fill="#e1f0f2" stroke="#245868" stroke-width="1.5" data-cell="0" /><rect x="60" y="24" width="24" height="24" fill="#e1f0f2" stroke="#245868" stroke-width="1.5" data-cell="1" /><rect x="92" y="24" width="24" height="24" fill="#e1f0f2" stroke="#245868" stroke-width="1.5" data-cell="2" /></g><g data-kind="ones" data-count="6" data-stage="single" id="blocks-1"><rect x="156" y="24" width="24" height="24" fill="#e1f0f2" stroke="#245868" stroke-width="1.5" data-cell="0" /><rect x="188" y="24" width="24" height="24" fill="#e1f0f2" stroke="#245868" stroke-width="1.5" data-cell="1" /><rect x="220" y="24" width="24" height="24" fill="#e1f0f2" stroke="#245868" stroke-width="1.5" data-cell="2" /><rect x="252" y="24" width="24" height="24" fill="#e1f0f2" stroke="#245868" stroke-width="1.5" data-cell="3" /><rect x="284" y="24" width="24" height="24" fill="#e1f0f2" stroke="#245868" stroke-width="1.5" data-cell="4" /><rect x="316" y="24" width="24" height="24" fill="#e1f0f2" stroke="#245868" stroke-width="1.5" data-cell="5" /></g><text x="280.0" y="92" font-family="Noto Sans Telugu, Nirmala UI, sans-serif" font-size="28" text-anchor="middle" fill="#19354a">3 + 6 = 9</text></svg>
