<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="355" viewBox="0 0 860 355" role="img" aria-labelledby="title desc" lang="te" font-family="Nirmala UI, Noto Sans Telugu, sans-serif">
  <title id="title">స్థాన విలువలు / Place-value digit correspondence</title>
  <desc id="desc">విస్తరణ రూపం: 200 + 10 + 5; సంక్షిప్త రూపం: 215. Red leading digits connect by arrows to their matching positions in the compact numeral.</desc>
  <rect width="860" height="355" fill="white" />
  <text x="430" y="30" font-size="23" fill="#153a4b" text-anchor="middle">విస్తరణ రూపం / expanded form</text>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#b12835" />
    </marker>
  </defs>
  <text x="175" y="73" font-size="27" fill="#153a4b" text-anchor="middle">వందలు</text>
  <text x="175" y="98" font-size="17" fill="#526573" text-anchor="middle">hundreds</text>
  <text x="160" y="145" font-size="32" fill="#b12835" text-anchor="middle" id="expanded-0-0" data-digit="2" data-role="expanded-digit" data-place-index="0">2</text>
  <text x="187" y="145" font-size="32" fill="#153a4b" text-anchor="middle" id="expanded-0-1" data-digit="0" data-role="expanded-digit" data-place-index="0">0</text>
  <text x="214" y="145" font-size="32" fill="#153a4b" text-anchor="middle" id="expanded-0-2" data-digit="0" data-role="expanded-digit" data-place-index="0">0</text>
  <text x="386" y="288" font-size="37" fill="#b12835" text-anchor="middle" id="compact-0" data-role="compact-digit" data-digit="2">2</text>
  <path d="M160 161C160 211 386 211 386 248" fill="none" stroke="#b12835" stroke-width="2.5" marker-end="url(#arrowhead)" data-role="digit-arrow" data-from="expanded-0-0" data-to="compact-0" data-place-value="100" />
  <text x="435" y="73" font-size="27" fill="#153a4b" text-anchor="middle">పదులు</text>
  <text x="435" y="98" font-size="17" fill="#526573" text-anchor="middle">tens</text>
  <text x="420" y="145" font-size="32" fill="#b12835" text-anchor="middle" id="expanded-1-0" data-digit="1" data-role="expanded-digit" data-place-index="1">1</text>
  <text x="447" y="145" font-size="32" fill="#153a4b" text-anchor="middle" id="expanded-1-1" data-digit="0" data-role="expanded-digit" data-place-index="1">0</text>
  <text x="430" y="288" font-size="37" fill="#b12835" text-anchor="middle" id="compact-1" data-role="compact-digit" data-digit="1">1</text>
  <path d="M420 161C420 211 430 211 430 248" fill="none" stroke="#b12835" stroke-width="2.5" marker-end="url(#arrowhead)" data-role="digit-arrow" data-from="expanded-1-0" data-to="compact-1" data-place-value="10" />
  <text x="695" y="73" font-size="27" fill="#153a4b" text-anchor="middle">ఒకట్లు</text>
  <text x="695" y="98" font-size="17" fill="#526573" text-anchor="middle">ones</text>
  <text x="680" y="145" font-size="32" fill="#b12835" text-anchor="middle" id="expanded-2-0" data-digit="5" data-role="expanded-digit" data-place-index="2">5</text>
  <text x="474" y="288" font-size="37" fill="#b12835" text-anchor="middle" id="compact-2" data-role="compact-digit" data-digit="5">5</text>
  <path d="M680 161C680 211 474 211 474 248" fill="none" stroke="#b12835" stroke-width="2.5" marker-end="url(#arrowhead)" data-role="digit-arrow" data-from="expanded-2-0" data-to="compact-2" data-place-value="1" />
  <text x="313" y="145" font-size="30" fill="#153a4b" text-anchor="middle">+</text>
  <text x="573" y="145" font-size="30" fill="#153a4b" text-anchor="middle">+</text>
  <text x="430" y="334" font-size="23" fill="#153a4b" text-anchor="middle">సంక్షిప్త రూపం / compact form</text>
</svg>
