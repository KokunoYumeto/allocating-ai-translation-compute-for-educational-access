<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc" lang="te" font-family="Nirmala UI, Noto Sans Telugu, sans-serif">
  <title id="title">అమెరికా డాలర్లు / U.S. dollar bill groups</title>
  <desc id="desc">3 × $100, 7 × $10, 4 × $1; అమెరికా డాలర్లు (USD). Schematic counting cards, not currency artwork: three $100 bills, seven $10 bills and four $1 bills. No currency conversion.</desc>
