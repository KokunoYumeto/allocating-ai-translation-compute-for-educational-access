  <text x="480" y="35" font-size="26" fill="#153a4b" text-anchor="middle">అమెరికా డాలర్లు (U.S. dollars)</text>
  <text x="480" y="66" font-size="18" fill="#526573" text-anchor="middle">లెక్కింపు నమూనా / schematic counting cards</text>
  <g data-kind="bill" data-denomination="100">
    <rect x="50" y="105" width="102" height="40" rx="5" fill="#edf4f7" stroke="#416477" stroke-width="1.8" />
    <text x="101" y="133" font-size="23" fill="#153a4b" text-anchor="middle">$100</text>
  </g>
  <g data-kind="bill" data-denomination="100">
