<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="530" viewBox="0 0 1080 530" role="img" aria-labelledby="title desc" lang="te" font-family="Nirmala UI, Noto Sans Telugu, sans-serif" data-source-number="23658" data-rounding-unit="100" data-kind="operation">
  <title id="title">సవరించి రాయడం / rounding: 035_img-02</title>
  <desc id="desc">దగ్గరి వందలకు సవరించండి / round to the nearest hundred. 23,658 to23,700; target digit6; add 1; replace all digits to the right with0s. New code-native bilingual redraw. Original raster unchanged. Arrows, underlines and numeral positions carry meaning independently of color.</desc>
  <rect width="1080" height="530" fill="white" />
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
