  </g>
  <text x="24" y="190" font-size="24" fill="#ad292e" text-anchor="start" data-role="operation-te">1 కలపండి</text>
  <text x="24" y="220" font-size="21" fill="#ad292e" text-anchor="start" lang="en" data-role="operation-en">add 1</text>
