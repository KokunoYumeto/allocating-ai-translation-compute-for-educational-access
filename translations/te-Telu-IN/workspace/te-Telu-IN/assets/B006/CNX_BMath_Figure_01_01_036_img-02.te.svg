<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="530" viewBox="0 0 1080 530" role="img" aria-labelledby="title desc" lang="te" font-family="Nirmala UI, Noto Sans Telugu, sans-serif" data-source-number="3978" data-rounding-unit="100" data-kind="operation">
  <title id="title">సవరించి రాయడం / rounding: 036_img-02</title>
  <desc id="desc">దగ్గరి వందలకు సవరించండి / round to the nearest hundred. 3,978 to4,000; target digit9; add 1: 9 + 1 = 10; Write 0 in the hundreds place.; Add 1 to the thousands place.; replace all digits to the right with0s. New code-native bilingual redraw. Original raster unchanged. Arrows, underlines and numeral positions carry meaning independently of color.</desc>
  <rect width="1080" height="530" fill="white" />
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#006b67" />
    </marker>
  </defs>
  <text x="540" y="37" font-size="27" fill="#006b67" text-anchor="middle" data-role="rounding-te">దగ్గరి వందలకు సవరించండి</text>
  <text x="540" y="70" font-size="22" fill="#006b67" text-anchor="middle" lang="en" data-role="rounding-en">round to the nearest hundred</text>
  <g data-role="input">
    <text x="524.0" y="164" font-size="54" fill="#153a4b" text-anchor="middle" data-role="digit" data-power="3">3</text>
    <text x="567.0" y="164" font-size="54" fill="#153a4b" text-anchor="middle" data-role="comma">,</text>
    <text x="610.0" y="164" font-size="54" fill="#153a4b" text-anchor="middle" data-role="digit" data-power="2">9</text>
    <text x="653.0" y="164" font-size="54" fill="#153a4b" text-anchor="middle" data-role="digit" data-power="1">7</text>
    <text x="696.0" y="164" font-size="54" fill="#153a4b" text-anchor="middle" data-role="digit" data-power="0">8</text>
  </g>
  <text x="24" y="190" font-size="24" fill="#ad292e" text-anchor="start" data-role="operation-te">1 కలపండి: 9 + 1 = 10</text>
  <text x="24" y="220" font-size="21" fill="#ad292e" text-anchor="start" lang="en" data-role="operation-en">add 1: 9 + 1 = 10</text>
  <text x="24" y="257" font-size="24" fill="#ad292e" text-anchor="start" data-role="operation-te">వందల స్థానంలో 0 రాయండి.</text>
  <text x="24" y="287" font-size="21" fill="#ad292e" text-anchor="start" lang="en" data-role="operation-en">Write 0 in the hundreds place.</text>
  <text x="24" y="324" font-size="24" fill="#ad292e" text-anchor="start" data-role="operation-te">వేల స్థానంలో 1 కలపండి.</text>
  <text x="24" y="354" font-size="21" fill="#ad292e" text-anchor="start" lang="en" data-role="operation-en">Add 1 to the thousands place.</text>
  <line x1="395" y1="180" x2="605.0" y2="172" stroke="#006b67" stroke-width="3" marker-end="url(#arrowhead)" data-role="target-arrow" data-power="2" />
  <path d="M635.0 178V191H714.0V178" fill="none" stroke="#006b67" stroke-width="2" data-role="suffix-bracket" data-low-power="0" data-high-power="1" />
  <text x="874" y="257" font-size="25" fill="#ad292e" text-anchor="middle" data-role="replace-te">0లతో భర్తీ చేయండి</text>
  <text x="874" y="289" font-size="22" fill="#ad292e" text-anchor="middle" lang="en" data-role="replace-en">replace with 0s</text>
  <line x1="874" y1="216" x2="674.5" y2="198" stroke="#006b67" stroke-width="3" marker-end="url(#arrowhead)" data-role="replace-arrow" data-low-power="0" data-high-power="1" />
  <line x1="610" y1="222" x2="610" y2="375" stroke="#006b67" stroke-width="3" marker-end="url(#arrowhead)" data-role="result-arrow" />
  <g data-role="result">
    <text x="524.0" y="437" font-size="54" fill="#153a4b" text-anchor="middle" data-role="digit" data-power="3">4</text>
    <text x="567.0" y="437" font-size="54" fill="#153a4b" text-anchor="middle" data-role="comma">,</text>
    <text x="610.0" y="437" font-size="54" fill="#153a4b" text-anchor="middle" data-role="digit" data-power="2">0</text>
    <text x="653.0" y="437" font-size="54" fill="#153a4b" text-anchor="middle" data-role="digit" data-power="1">0</text>
    <text x="696.0" y="437" font-size="54" fill="#153a4b" text-anchor="middle" data-role="digit" data-power="0">0</text>
  </g>
</svg>
