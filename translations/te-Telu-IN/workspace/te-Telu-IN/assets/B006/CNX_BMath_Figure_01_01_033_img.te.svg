<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="530" viewBox="0 0 1080 530" role="img" aria-labelledby="title desc" lang="te" font-family="Nirmala UI, Noto Sans Telugu, sans-serif" data-source-number="72" data-rounding-unit="10" data-kind="operation">
  <title id="title">సవరించి రాయడం / rounding: 033_img</title>
  <desc id="desc">దగ్గరి పదులకు సవరించండి / round to the nearest ten. 72 to70; target digit7; do not add 1; replace all digits to the right with0s. Source ones digit2 is crossed out. New code-native bilingual redraw. Original raster unchanged. Arrows, underlines and numeral positions carry meaning independently of color.</desc>
  <rect width="1080" height="530" fill="white" />
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#006b67" />
    </marker>
  </defs>
  <text x="540" y="37" font-size="27" fill="#006b67" text-anchor="middle" data-role="rounding-te">దగ్గరి పదులకు సవరించండి</text>
  <text x="540" y="70" font-size="22" fill="#006b67" text-anchor="middle" lang="en" data-role="rounding-en">round to the nearest ten</text>
  <g data-role="input">
    <text x="588.5" y="164" font-size="54" fill="#153a4b" text-anchor="middle" data-role="digit" data-power="1">7</text>
    <text x="631.5" y="164" font-size="54" fill="#153a4b" text-anchor="middle" data-role="digit" data-power="0">2</text>
  </g>
  <text x="24" y="190" font-size="24" fill="#ad292e" text-anchor="start" data-role="operation-te">1 కలపవద్దు</text>
  <text x="24" y="220" font-size="21" fill="#ad292e" text-anchor="start" lang="en" data-role="operation-en">do not add 1</text>
  <line x1="395" y1="180" x2="583.5" y2="172" stroke="#006b67" stroke-width="3" marker-end="url(#arrowhead)" data-role="target-arrow" data-power="1" />
  <line x1="611.5" x2="651.5" y1="124" y2="168" stroke="#ad292e" stroke-width="3" data-role="cross-out" data-power="0" />
  <text x="874" y="257" font-size="25" fill="#ad292e" text-anchor="middle" data-role="replace-te">0 తో భర్తీ చేయండి</text>
  <text x="874" y="289" font-size="22" fill="#ad292e" text-anchor="middle" lang="en" data-role="replace-en">replace with 0</text>
  <line x1="874" y1="216" x2="631.5" y2="198" stroke="#006b67" stroke-width="3" marker-end="url(#arrowhead)" data-role="replace-arrow" data-low-power="0" data-high-power="0" />
  <line x1="610" y1="222" x2="610" y2="375" stroke="#006b67" stroke-width="3" marker-end="url(#arrowhead)" data-role="result-arrow" />
  <g data-role="result">
    <text x="588.5" y="437" font-size="54" fill="#153a4b" text-anchor="middle" data-role="digit" data-power="1">7</text>
    <text x="631.5" y="437" font-size="54" fill="#153a4b" text-anchor="middle" data-role="digit" data-power="0">0</text>
  </g>
</svg>
