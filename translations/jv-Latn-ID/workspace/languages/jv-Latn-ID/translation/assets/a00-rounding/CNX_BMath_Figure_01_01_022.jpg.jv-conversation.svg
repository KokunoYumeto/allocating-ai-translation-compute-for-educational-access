<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="jv-Latn-ID" role="img" aria-labelledby="title desc" viewBox="0 0 390 190" width="390" height="190" shape-rendering="geometricPrecision">
<title id="title">Digit pambandhing luwih gedhé tinimbang lima</title>
<desc id="desc">Ing wilangan 76, digit 7 ana ing panggonan puluhan lan digit 6 luwih gedhé tinimbang 5.</desc>
<rect width="390" height="190" fill="#ffffff"/>
<text font-family="Times New Roman, serif" x="150" y="125" font-size="31" text-anchor="middle" fill="#111111" font-weight="normal">7</text>
<text font-family="Times New Roman, serif" x="180" y="125" font-size="31" text-anchor="middle" fill="#111111" font-weight="normal">6</text>
<text x="150" y="28" font-size="21" text-anchor="middle" fill="#42d9c6" font-weight="normal" font-style="italic">panggonan puluhan</text>
<line x1="150" y1="38" x2="150" y2="93" stroke="#42d9c6" stroke-width="3" stroke-linecap="round"/><polygon points="150,93 154.704,85.3273 145.296,85.3273" fill="#42d9c6"/>
<text x="245" y="176" font-size="20" text-anchor="middle" fill="#e52f38" font-weight="normal">luwih gedhé tinimbang 5</text>
<line x1="228" y1="158" x2="185" y2="140" stroke="#e52f38" stroke-width="3" stroke-linecap="round"/><polygon points="185,140 194.117,138.938 190.642,147.24" fill="#e52f38"/>
<line x1="172" y1="133" x2="188" y2="133" stroke="#111111" stroke-width="2"/>
</svg>
