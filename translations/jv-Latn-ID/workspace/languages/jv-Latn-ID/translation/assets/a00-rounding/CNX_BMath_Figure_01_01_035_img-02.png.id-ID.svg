<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="id-ID" role="img" aria-labelledby="title desc" viewBox="0 0 470 210" width="470" height="210" shape-rendering="geometricPrecision">
<title id="title">Membulatkan 23,658 menjadi 23,700</title>
<desc id="desc">Digit ratusan ditambah satu dan digit di kanannya diganti nol, sehingga hasil pembulatan adalah 23,700.</desc>
<rect width="470" height="210" fill="#ffffff"/>
<text x="245" y="34" font-size="28" text-anchor="middle" fill="#111111" font-weight="normal">23,658</text>
<text x="245" y="190" font-size="28" text-anchor="middle" fill="#111111" font-weight="normal">23,700</text>
<text x="70" y="94" font-size="18" text-anchor="middle" fill="#e52f38" font-weight="normal">tambahkan 1</text>
<line x1="145" y1="83" x2="215" y2="43" stroke="#e52f38" stroke-width="3" stroke-linecap="round"/><polygon points="215,43 207.004,42.7532 211.153,50.0143" fill="#e52f38"/>
<text x="455" y="114" font-size="18" text-anchor="end" fill="#e52f38" font-weight="normal">ganti dengan 0</text>
<line x1="365" y1="104" x2="282" y2="43" stroke="#e52f38" stroke-width="3" stroke-linecap="round"/><polygon points="282,43 285.019,50.4084 289.972,43.6696" fill="#e52f38"/>
<line x1="245" y1="65" x2="245" y2="160" stroke="#42b9d7" stroke-width="3" stroke-linecap="round"/><polygon points="245,160 250.227,151.475 239.773,151.475" fill="#42b9d7"/>
</svg>
