<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="id-ID" role="img" aria-labelledby="title desc" viewBox="0 0 720 210" width="720" height="210" shape-rendering="geometricPrecision">
<title id="title">Membulatkan 29,504 menjadi 30,000</title>
<desc id="desc">Satu ditambahkan pada digit 9; nol ditulis di tempat ribuan; satu ditambahkan ke tempat puluh ribuan; tiga digit terakhir diganti nol.</desc>
<rect width="720" height="210" fill="#ffffff"/>
<text x="504" y="33" font-size="28" text-anchor="middle" fill="#111111" font-weight="normal">29,504</text>
<text x="504" y="188" font-size="28" text-anchor="middle" fill="#111111" font-weight="normal">30,000</text>
<text x="12" y="65" font-size="17" text-anchor="start" fill="#e52f38" font-weight="normal">tambahkan 1 (9 + 1 = 10)</text>
<text x="12" y="85.06" font-size="17" text-anchor="start" fill="#e52f38" font-weight="normal">Tulis 0 di tempat ribuan.</text>
<text x="12" y="105.12" font-size="17" text-anchor="start" fill="#e52f38" font-weight="normal">Tambahkan 1 ke tempat puluh ribuan.</text>
<line x1="345.6" y1="73" x2="474" y2="42" stroke="#e52f38" stroke-width="3" stroke-linecap="round"/><polygon points="474,42 466.389,39.5359 468.352,47.6653" fill="#e52f38"/>
<text x="708" y="110" font-size="17" text-anchor="end" fill="#e52f38" font-weight="normal">ganti dengan 0</text>
<line x1="590" y1="100" x2="539" y2="43" stroke="#e52f38" stroke-width="3" stroke-linecap="round"/><polygon points="539,43 540.431,50.8709 546.664,45.2945" fill="#e52f38"/>
<line x1="504" y1="65" x2="504" y2="160" stroke="#42b9d7" stroke-width="3" stroke-linecap="round"/><polygon points="504,160 509.227,151.475 498.773,151.475" fill="#42b9d7"/>
</svg>
