<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="id-ID" role="img" aria-labelledby="title desc" viewBox="0 0 390 190" width="390" height="190" shape-rendering="geometricPrecision">
<title id="title">Digit pembanding kurang dari lima</title>
<desc id="desc">Pada bilangan 72, digit 7 berada di tempat puluhan dan digit 2 kurang dari 5.</desc>
<rect width="390" height="190" fill="#ffffff"/>
<text x="150" y="125" font-size="31" text-anchor="middle" fill="#111111" font-weight="normal">7</text>
<text x="180" y="125" font-size="31" text-anchor="middle" fill="#111111" font-weight="normal">2</text>
<text x="150" y="28" font-size="21" text-anchor="middle" fill="#42d9c6" font-weight="normal" font-style="italic">tempat puluhan</text>
<line x1="150" y1="38" x2="150" y2="93" stroke="#42d9c6" stroke-width="3" stroke-linecap="round"/><polygon points="150,93 154.704,85.3273 145.296,85.3273" fill="#42d9c6"/>
<text x="245" y="176" font-size="20" text-anchor="middle" fill="#e52f38" font-weight="normal">kurang dari 5</text>
<line x1="228" y1="158" x2="185" y2="133" stroke="#42d9c6" stroke-width="3" stroke-linecap="round"/><polygon points="185,133 189.269,140.923 193.998,132.79" fill="#42d9c6"/>
</svg>
