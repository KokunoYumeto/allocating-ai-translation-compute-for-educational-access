<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="jv-Latn-ID" role="img" aria-labelledby="title desc" viewBox="0 0 650 210" width="650" height="210" shape-rendering="geometricPrecision">
<title id="title">Mbunderake 3,978 dadi 4,000</title>
<desc id="desc">Siji ditambahake ing digit 9; nol ditulis ing panggonan atusan; siji ditambahake ing panggonan éwuan; digit liyane diganti nol.</desc>
<rect width="650" height="210" fill="#ffffff"/>
<text font-family="Times New Roman, serif" x="455" y="33" font-size="28" text-anchor="middle" fill="#111111" font-weight="normal">3,978</text>
<text font-family="Times New Roman, serif" x="455" y="188" font-size="28" text-anchor="middle" fill="#111111" font-weight="normal">4,000</text>
<text x="12" y="65" font-size="17" text-anchor="start" fill="#e52f38" font-weight="normal">tambahna 1 (9 + 1 = 10)</text>
<text x="12" y="85.06" font-size="17" text-anchor="start" fill="#e52f38" font-weight="normal">Tulisen 0 ing panggonan atusan.</text>
<text x="12" y="105.12" font-size="17" text-anchor="start" fill="#e52f38" font-weight="normal">Tambahna 1 ing panggonan éwuan.</text>
<line x1="312" y1="73" x2="452" y2="42" stroke="#e52f38" stroke-width="3" stroke-linecap="round"/><polygon points="452,42 445.162,48.1231 443.216,39.336" fill="#e52f38"/>
<text x="638" y="110" font-size="17" text-anchor="end" fill="#e52f38" font-weight="normal">ganti nganggo 0</text>
<line x1="520" y1="100" x2="473" y2="50" stroke="#e52f38" stroke-width="3" stroke-linecap="round"/><polygon points="473,50 481.758,52.7469 475.2,58.9111" fill="#e52f38"/>
<line x1="455" y1="65" x2="455" y2="160" stroke="#42b9d7" stroke-width="3" stroke-linecap="round"/><polygon points="455,160 460.227,151.475 449.773,151.475" fill="#42b9d7"/>
<path d="M 459,38 V 43 H 486 V 38" fill="none" stroke="#42b9d7" stroke-width="2"/>
</svg>
