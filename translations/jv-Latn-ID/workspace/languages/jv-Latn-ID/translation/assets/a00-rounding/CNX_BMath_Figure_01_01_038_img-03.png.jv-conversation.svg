<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="jv-Latn-ID" role="img" aria-labelledby="title desc" viewBox="0 0 720 210" width="720" height="210" shape-rendering="geometricPrecision">
<title id="title">Mbunderake 29,504 dadi 30,000</title>
<desc id="desc">Siji ditambahake ing digit 9; nol ditulis ing panggonan éwuan; siji ditambahake ing panggonan puluhan éwu; telung digit pungkasan diganti nol.</desc>
<rect width="720" height="210" fill="#ffffff"/>
<text font-family="Times New Roman, serif" x="504" y="33" font-size="28" text-anchor="middle" fill="#111111" font-weight="normal">29,504</text>
<text font-family="Times New Roman, serif" x="504" y="188" font-size="28" text-anchor="middle" fill="#111111" font-weight="normal">30,000</text>
<text x="12" y="65" font-size="17" text-anchor="start" fill="#e52f38" font-weight="normal">tambahna 1 (9 + 1 = 10)</text>
<text x="12" y="85.06" font-size="17" text-anchor="start" fill="#e52f38" font-weight="normal">Tulisen 0 ing panggonan éwuan.</text>
<text x="12" y="105.12" font-size="17" text-anchor="start" fill="#e52f38" font-weight="normal">Tambahna 1 ing panggonan puluhan éwu.</text>
<line x1="345.6" y1="73" x2="487" y2="42" stroke="#e52f38" stroke-width="3" stroke-linecap="round"/><polygon points="487,42 480.149,48.1088 478.222,39.3176" fill="#e52f38"/>
<text x="708" y="110" font-size="17" text-anchor="end" fill="#e52f38" font-weight="normal">ganti nganggo 0</text>
<line x1="590" y1="100" x2="522" y2="50" stroke="#e52f38" stroke-width="3" stroke-linecap="round"/><polygon points="522,50 531.111,51.1137 525.779,58.3646" fill="#e52f38"/>
<line x1="504" y1="65" x2="504" y2="160" stroke="#42b9d7" stroke-width="3" stroke-linecap="round"/><polygon points="504,160 509.227,151.475 498.773,151.475" fill="#42b9d7"/>
<path d="M 501,38 V 43 H 543 V 38" fill="none" stroke="#42b9d7" stroke-width="2"/>
</svg>
