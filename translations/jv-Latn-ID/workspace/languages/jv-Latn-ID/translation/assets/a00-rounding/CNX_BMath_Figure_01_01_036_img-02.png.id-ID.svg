<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="id-ID" role="img" aria-labelledby="title desc" viewBox="0 0 650 210" width="650" height="210" shape-rendering="geometricPrecision">
<title id="title">Membulatkan 3,978 menjadi 4,000</title>
<desc id="desc">Satu ditambahkan pada digit 9; nol ditulis di tempat ratusan; satu ditambahkan ke tempat ribuan; digit sisanya diganti nol.</desc>
<rect width="650" height="210" fill="#ffffff"/>
<text x="455" y="33" font-size="28" text-anchor="middle" fill="#111111" font-weight="normal">3,978</text>
<text x="455" y="188" font-size="28" text-anchor="middle" fill="#111111" font-weight="normal">4,000</text>
<text x="12" y="65" font-size="17" text-anchor="start" fill="#e52f38" font-weight="normal">tambahkan 1 (9 + 1 = 10)</text>
<text x="12" y="85.06" font-size="17" text-anchor="start" fill="#e52f38" font-weight="normal">Tulis 0 di tempat ratusan.</text>
<text x="12" y="105.12" font-size="17" text-anchor="start" fill="#e52f38" font-weight="normal">Tambahkan 1 ke tempat ribuan.</text>
<line x1="312" y1="73" x2="425" y2="42" stroke="#e52f38" stroke-width="3" stroke-linecap="round"/><polygon points="425,42 417.317,39.7719 419.529,47.8369" fill="#e52f38"/>
<text x="638" y="110" font-size="17" text-anchor="end" fill="#e52f38" font-weight="normal">ganti dengan 0</text>
<line x1="520" y1="100" x2="490" y2="43" stroke="#e52f38" stroke-width="3" stroke-linecap="round"/><polygon points="490,43 489.476,50.9828 496.877,47.0878" fill="#e52f38"/>
<line x1="455" y1="65" x2="455" y2="160" stroke="#42b9d7" stroke-width="3" stroke-linecap="round"/><polygon points="455,160 460.227,151.475 449.773,151.475" fill="#42b9d7"/>
</svg>
