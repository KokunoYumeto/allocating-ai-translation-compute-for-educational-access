<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="id-ID" role="img" aria-labelledby="title desc" viewBox="0 0 520 165" width="520" height="165" shape-rendering="geometricPrecision">
<title id="title">Membulatkan 72 menjadi 70</title>
<desc id="desc">Digit puluhan tidak ditambah dan digit satuan diganti nol, sehingga 72 dibulatkan menjadi 70.</desc>
<rect width="520" height="165" fill="#ffffff"/>
<text x="260" y="34" font-size="31" text-anchor="middle" fill="#111111" font-weight="normal">72</text>
<text x="260" y="107" font-size="31" text-anchor="middle" fill="#111111" font-weight="normal">70</text>
<text x="102" y="91" font-size="20" text-anchor="middle" fill="#e52f38" font-weight="normal">jangan tambahkan 1</text>
<line x1="180" y1="78" x2="240" y2="45" stroke="#42d9c6" stroke-width="3" stroke-linecap="round"/><polygon points="240,45 231.01,44.5757 235.544,52.8195" fill="#42d9c6"/>
<text x="405" y="91" font-size="20" text-anchor="middle" fill="#e52f38" font-weight="normal">ganti dengan 0</text>
<line x1="342" y1="78" x2="282" y2="45" stroke="#e52f38" stroke-width="3" stroke-linecap="round"/><polygon points="282,45 286.456,52.8195 290.99,44.5757" fill="#e52f38"/>
</svg>
