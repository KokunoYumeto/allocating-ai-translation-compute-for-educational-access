<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" xml:lang="jv-Latn-ID" role="img" aria-labelledby="title desc" viewBox="0 0 980 394" width="980" height="394" shape-rendering="geometricPrecision">
<ns0:title id="title">Pambiji dhiri babagan wilangan cacah lan nilai panggonan</ns0:title>
<ns0:desc id="desc">Dhaptar enem katrampilan kanthi pilihan Yakin, Kanthi pitulungan, utawa Ora, aku durung mangerteni.</ns0:desc>
