<ns0:text x="725" y="33" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Kanthi</ns0:text>
<ns0:text x="725" y="51" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">pitulungan</ns0:text>
<ns0:text x="890" y="23" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">Ora, aku</ns0:text>
