<svg xmlns="http://www.w3.org/2000/svg" xml:lang="id-ID" role="img" aria-labelledby="title desc" viewBox="0 0 400 145" width="400" height="145" shape-rendering="geometricPrecision">
<title id="title">Bangun enam sisi dalam inci</title>
<desc id="desc">Bangun enam sisi berukuran 25 inci, 10 inci, 14 inci, 7 inci, dan 11 inci; sisi penutup ditentukan oleh bentuk.</desc>
<rect width="400" height="145" fill="#ffffff"/>
<path d="M20 20 H335 V135 H165 V55 H20 Z" fill="none" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
<text x="205" y="16" font-size="17" text-anchor="middle" fill="#111111" font-weight="normal">25 inci</text>
<text x="82" y="49" font-size="17" text-anchor="middle" fill="#111111" font-weight="normal">11 inci</text>
<text x="344" y="83" font-size="17" text-anchor="middle" fill="#111111" font-weight="normal">10 inci</text>
<text x="182" y="92" font-size="17" text-anchor="middle" fill="#111111" font-weight="normal">7 inci</text>
<text x="250" y="132" font-size="17" text-anchor="middle" fill="#111111" font-weight="normal">14 inci</text>
</svg>
