<?xml version='1.0' encoding='utf-8'?>
<svg:svg xmlns:svg="http://www.w3.org/2000/svg" xml:lang="jv-Latn-ID" role="img" aria-labelledby="title desc" viewBox="0 0 980 342" width="980" height="342" shape-rendering="geometricPrecision">
<svg:title id="title">Pambiji mandiri katrampilan panambahan</svg:title>
<svg:desc id="desc">Daftar limang katrampilan panambahan kanthi pilihan Yakin, Kanthi pitulungan sethithik, utawa Ora—aku durung mangerteni.</svg:desc>
<svg:rect width="980" height="342" fill="#ffffff" />
<svg:rect x="0" y="0" width="500" height="80" fill="#a9d8dc" stroke="#22a5b2" stroke-width="2" />
<svg:rect x="500" y="0" width="150" height="80" fill="#a9d8dc" stroke="#22a5b2" stroke-width="2" />
<svg:rect x="650" y="0" width="150" height="80" fill="#a9d8dc" stroke="#22a5b2" stroke-width="2" />
<svg:rect x="800" y="0" width="180" height="80" fill="#a9d8dc" stroke="#22a5b2" stroke-width="2" />
<svg:text x="12" y="47" font-size="20" text-anchor="start" fill="#111111" font-weight="normal">Aku bisa…</svg:text>
<svg:text x="575" y="47" font-size="18" text-anchor="middle" fill="#111111" font-weight="bold">Yakin</svg:text>
<svg:text x="725" y="33" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Kanthi pitulungan</svg:text>
<svg:text x="725" y="51" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">sethithik</svg:text>
<svg:text x="890" y="23" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">Ora—aku</svg:text>
<svg:text x="890" y="40" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">durung</svg:text>
<svg:text x="890" y="57" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">mangerteni!</svg:text>
<svg:rect x="0" y="80" width="500" height="52" fill="#eff8f8" stroke="#22a5b2" stroke-width="1.5" />
<svg:rect x="500" y="80" width="150" height="52" fill="#ffffff" stroke="#22a5b2" stroke-width="1.5" />
<svg:rect x="650" y="80" width="150" height="52" fill="#eff8f8" stroke="#22a5b2" stroke-width="1.5" />
<svg:rect x="800" y="80" width="180" height="52" fill="#ffffff" stroke="#22a5b2" stroke-width="1.5" />
<svg:text x="12" y="113" font-size="16" text-anchor="start" fill="#111111" font-weight="normal">nggunakake notasi panambahan.</svg:text>
<svg:rect x="0" y="132" width="500" height="52" fill="#eff8f8" stroke="#22a5b2" stroke-width="1.5" />
<svg:rect x="500" y="132" width="150" height="52" fill="#ffffff" stroke="#22a5b2" stroke-width="1.5" />
<svg:rect x="650" y="132" width="150" height="52" fill="#eff8f8" stroke="#22a5b2" stroke-width="1.5" />
<svg:rect x="800" y="132" width="180" height="52" fill="#ffffff" stroke="#22a5b2" stroke-width="1.5" />
<svg:text x="12" y="165" font-size="16" text-anchor="start" fill="#111111" font-weight="normal">nggambarake panambahan wilangan cacah nganggo model.</svg:text>
<svg:rect x="0" y="184" width="500" height="52" fill="#eff8f8" stroke="#22a5b2" stroke-width="1.5" />
<svg:rect x="500" y="184" width="150" height="52" fill="#ffffff" stroke="#22a5b2" stroke-width="1.5" />
<svg:rect x="650" y="184" width="150" height="52" fill="#eff8f8" stroke="#22a5b2" stroke-width="1.5" />
<svg:rect x="800" y="184" width="180" height="52" fill="#ffffff" stroke="#22a5b2" stroke-width="1.5" />
<svg:text x="12" y="217" font-size="16" text-anchor="start" fill="#111111" font-weight="normal">nambah wilangan cacah tanpa model.</svg:text>
<svg:rect x="0" y="236" width="500" height="52" fill="#eff8f8" stroke="#22a5b2" stroke-width="1.5" />
<svg:rect x="500" y="236" width="150" height="52" fill="#ffffff" stroke="#22a5b2" stroke-width="1.5" />
<svg:rect x="650" y="236" width="150" height="52" fill="#eff8f8" stroke="#22a5b2" stroke-width="1.5" />
<svg:rect x="800" y="236" width="180" height="52" fill="#ffffff" stroke="#22a5b2" stroke-width="1.5" />
<svg:text x="12" y="269" font-size="16" text-anchor="start" fill="#111111" font-weight="normal">ngowahi frasa tembung dadi notasi matematika.</svg:text>
<svg:rect x="0" y="288" width="500" height="52" fill="#eff8f8" stroke="#22a5b2" stroke-width="1.5" />
<svg:rect x="500" y="288" width="150" height="52" fill="#ffffff" stroke="#22a5b2" stroke-width="1.5" />
<svg:rect x="650" y="288" width="150" height="52" fill="#eff8f8" stroke="#22a5b2" stroke-width="1.5" />
<svg:rect x="800" y="288" width="180" height="52" fill="#ffffff" stroke="#22a5b2" stroke-width="1.5" />
<svg:text x="12" y="321" font-size="16" text-anchor="start" fill="#111111" font-weight="normal">nambah wilangan cacah ing penerapan.</svg:text>
</svg:svg>
