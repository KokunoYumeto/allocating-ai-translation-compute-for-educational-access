<text x="35" y="78" font-size="17" text-anchor="middle" fill="#111111" font-weight="normal">14 inci</text>
<text x="198" y="78" font-size="17" text-anchor="middle" fill="#111111" font-weight="normal">12 inci</text>
<text x="120" y="142" font-size="17" text-anchor="middle" fill="#111111" font-weight="normal">18 inci</text>
</svg>
