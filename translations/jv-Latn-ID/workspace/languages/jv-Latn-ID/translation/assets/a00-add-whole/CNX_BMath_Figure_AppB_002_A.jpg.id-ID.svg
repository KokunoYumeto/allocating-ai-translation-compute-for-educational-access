<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:lang="id-ID" role="img" aria-labelledby="title desc" viewBox="0 0 980 342" width="980" height="342" shape-rendering="geometricPrecision">
<title id="title">Penilaian diri keterampilan penjumlahan</title>
<desc id="desc">Daftar lima keterampilan penjumlahan dengan pilihan Yakin, Dengan sedikit bantuan, atau Tidak—saya belum memahaminya.</desc>
<rect width="980" height="342" fill="#ffffff"/>
<rect x="0" y="0" width="500" height="80" fill="#a9d8dc" stroke="#22a5b2" stroke-width="2"/>
<rect x="500" y="0" width="150" height="80" fill="#a9d8dc" stroke="#22a5b2" stroke-width="2"/>
<rect x="650" y="0" width="150" height="80" fill="#a9d8dc" stroke="#22a5b2" stroke-width="2"/>
<rect x="800" y="0" width="180" height="80" fill="#a9d8dc" stroke="#22a5b2" stroke-width="2"/>
<text x="12" y="47" font-size="20" text-anchor="start" fill="#111111" font-weight="normal">Saya dapat…</text>
<text x="575" y="47" font-size="18" text-anchor="middle" fill="#111111" font-weight="bold">Yakin</text>
<text x="725" y="33" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">Dengan sedikit</text>
<text x="725" y="51" font-size="16" text-anchor="middle" fill="#111111" font-weight="bold">bantuan</text>
<text x="890" y="23" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">Tidak—saya</text>
<text x="890" y="40" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">belum</text>
<text x="890" y="57" font-size="15" text-anchor="middle" fill="#111111" font-weight="bold">memahaminya!</text>
<rect x="0" y="80" width="500" height="52" fill="#eff8f8" stroke="#22a5b2" stroke-width="1.5"/>
<rect x="500" y="80" width="150" height="52" fill="#ffffff" stroke="#22a5b2" stroke-width="1.5"/>
<rect x="650" y="80" width="150" height="52" fill="#eff8f8" stroke="#22a5b2" stroke-width="1.5"/>
<rect x="800" y="80" width="180" height="52" fill="#ffffff" stroke="#22a5b2" stroke-width="1.5"/>
<text x="12" y="113" font-size="16" text-anchor="start" fill="#111111" font-weight="normal">menggunakan notasi penjumlahan.</text>
<rect x="0" y="132" width="500" height="52" fill="#eff8f8" stroke="#22a5b2" stroke-width="1.5"/>
<rect x="500" y="132" width="150" height="52" fill="#ffffff" stroke="#22a5b2" stroke-width="1.5"/>
<rect x="650" y="132" width="150" height="52" fill="#eff8f8" stroke="#22a5b2" stroke-width="1.5"/>
<rect x="800" y="132" width="180" height="52" fill="#ffffff" stroke="#22a5b2" stroke-width="1.5"/>
<text x="12" y="165" font-size="16" text-anchor="start" fill="#111111" font-weight="normal">memodelkan penjumlahan bilangan cacah.</text>
<rect x="0" y="184" width="500" height="52" fill="#eff8f8" stroke="#22a5b2" stroke-width="1.5"/>
<rect x="500" y="184" width="150" height="52" fill="#ffffff" stroke="#22a5b2" stroke-width="1.5"/>
<rect x="650" y="184" width="150" height="52" fill="#eff8f8" stroke="#22a5b2" stroke-width="1.5"/>
<rect x="800" y="184" width="180" height="52" fill="#ffffff" stroke="#22a5b2" stroke-width="1.5"/>
<text x="12" y="217" font-size="16" text-anchor="start" fill="#111111" font-weight="normal">menjumlahkan bilangan cacah tanpa model.</text>
<rect x="0" y="236" width="500" height="52" fill="#eff8f8" stroke="#22a5b2" stroke-width="1.5"/>
<rect x="500" y="236" width="150" height="52" fill="#ffffff" stroke="#22a5b2" stroke-width="1.5"/>
<rect x="650" y="236" width="150" height="52" fill="#eff8f8" stroke="#22a5b2" stroke-width="1.5"/>
<rect x="800" y="236" width="180" height="52" fill="#ffffff" stroke="#22a5b2" stroke-width="1.5"/>
<text x="12" y="269" font-size="16" text-anchor="start" fill="#111111" font-weight="normal">menerjemahkan frasa kata ke notasi matematika.</text>
<rect x="0" y="288" width="500" height="52" fill="#eff8f8" stroke="#22a5b2" stroke-width="1.5"/>
<rect x="500" y="288" width="150" height="52" fill="#ffffff" stroke="#22a5b2" stroke-width="1.5"/>
<rect x="650" y="288" width="150" height="52" fill="#eff8f8" stroke="#22a5b2" stroke-width="1.5"/>
<rect x="800" y="288" width="180" height="52" fill="#ffffff" stroke="#22a5b2" stroke-width="1.5"/>
<text x="12" y="321" font-size="16" text-anchor="start" fill="#111111" font-weight="normal">menjumlahkan bilangan cacah dalam penerapan.</text>
</svg>
