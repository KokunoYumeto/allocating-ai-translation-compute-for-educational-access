<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="26" viewBox="0 0 220 26"
     role="img" aria-labelledby="title desc">
  <title id="title">Basis dan eksponen</title>
  <desc id="desc">Pada bentuk dua pangkat tiga, dua adalah basis dan tiga adalah eksponen.</desc>
  <rect width="220" height="26" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="1" y="20" fill="#d71920" font-size="15">basis</text>
    <text x="148" y="19" fill="#4cebd8" font-size="14.5">eksponen</text>
  </g>
  <g fill="#000" stroke="#000" stroke-width="2.1" stroke-linecap="square">
    <line x1="46" y1="13" x2="76" y2="13"/>
    <path d="M76 13 68 9v8z" stroke="none"/>
    <line x1="143" y1="10" x2="113" y2="10"/>
