<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="224" height="104" viewBox="0 0 224 104"
     role="img" aria-labelledby="title desc">
  <title id="title">Notasi eksponen</title>
  <desc id="desc">Pada a pangkat n, a adalah basis dan n adalah eksponen. Bentuk itu sama dengan hasil kali n faktor a.</desc>
  <rect width="224" height="104" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="1" y="22" fill="#d71920" font-size="16">basis</text>
    <text x="149" y="21" fill="#4cebd8" font-size="15">eksponen</text>
  </g>
  <g fill="#000" stroke="#000" stroke-width="2.1" stroke-linecap="square">
    <line x1="47" y1="14" x2="78" y2="14"/>
    <path d="M78 14 70 10v8z" stroke="none"/>
    <line x1="144" y1="11" x2="114" y2="11"/>
    <path d="M114 11 122 7v8z" stroke="none"/>
  </g>
  <g fill="#000" font-family="Times New Roman, Times, serif" font-style="italic">
    <text x="86" y="23" font-size="23">a</text>
    <text x="99" y="12" font-size="13">n</text>
    <text x="1" y="61" font-size="22">a<tspan baseline-shift="super" font-size="12">n</tspan><tspan baseline-shift="baseline" font-size="22"> = a · a · a · … · a</tspan></text>
  </g>
  <path d="M39 68v3q0 5 7 5h37q9 0 9 9 0-9 9-9h39q7 0 7-5v-3"
        fill="none" stroke="#4cebd8" stroke-width="1.8"/>
  <text x="93" y="100" fill="#4cebd8" font-family="Arial, Helvetica, sans-serif"
        font-size="17" font-style="italic" text-anchor="middle">n faktor</text>
</svg>
