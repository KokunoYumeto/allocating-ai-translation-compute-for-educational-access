<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="632" height="172" viewBox="0 0 632 172" role="img" aria-labelledby="title desc" xml:lang="jv-Latn-ID">
  <title id="title">Dhaptar kanggo mriksa awake dhewe</title>
  <desc id="desc">Patang ancas sinau bisa dipriksa nganggo pilihan yakin, nganggo pitulungan sithik, utawa durung ngerti.</desc>
  <rect width="632" height="172" fill="#f1f8f8" />
  <rect width="632" height="51" fill="#a5d4d6" />
  <g fill="none" stroke="#27989d" stroke-width="1.5">
    <rect x="0.75" y="0.75" width="630.5" height="170.5" />
    <path d="M280 0v172M398 0v172M515 0v172M0 51h632M0 77h632M0 103h632M0 129h632" />
  </g>
  <g fill="#0b0b0b" font-family="Arial, Helvetica, sans-serif">
    <text x="6" y="33" font-size="14">Aku bisa…</text>
    <g font-size="11.5" font-weight="700" text-anchor="middle">
      <text x="339" y="32">Yakin</text>
      <text x="456.5" y="23">Nganggo pitulungan</text>
      <text x="456.5" y="37">sithik</text>
      <text x="573.5" y="23">Ora—aku ora</text>
      <text x="573.5" y="37">ngerti</text>
    </g>
    <g font-size="12.3">
      <text x="6" y="69">nganggo variabel lan tandha aljabar.</text>
      <text x="6" y="95">ngenali wujud aljabar lan persamaan.</text>
      <text x="6" y="121">nggawe wujud mawa eksponen luwih prasaja.</text>
      <text x="6" y="146">nggawe wujud luwih prasaja</text>
      <text x="6" y="162">nganggo urutan ngetung.</text>
    </g>
  </g>
</svg>