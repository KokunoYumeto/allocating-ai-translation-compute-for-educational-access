<title id="title">Nglompokaké manèh patang puluhan lan telung satuan</title>
<desc id="desc">Gambar iki ana rong klompok. Klompok kapisan ing kiwa ana 3 baris blok basis-10 biru lan 1 baris abang isi 10 blok, kanthi label 4 puluhan. Ing jejere baris kapisan blok puluhan ana 3 blok satuan kanthi label 3 satuan. Panah nuding tengen menyang klompok kapindho sing ana telung baris blok basis-10 kanthi label 3 puluhan. Ing jejere ana sabaris isi 3 blok biru lan rong baris abang sing saben baris isine limang blok satuan, kanthi label 13 satuan.</desc>
