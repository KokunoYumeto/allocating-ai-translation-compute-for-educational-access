<g id="table-text" font-family="Arial, sans-serif" fill="#111111">
<text id="header-1" x="5" y="31" font-size="14">Aku bisa...</text>
<text id="header-2" x="355.5" y="31" text-anchor="middle" font-size="13" font-weight="bold">Yakin</text>
<text id="header-3" x="472.5" text-anchor="middle" font-size="13" font-weight="bold"><tspan x="472.5" y="13">Kanthi</tspan><tspan x="472.5" y="29">pitulungan</tspan><tspan x="472.5" y="45">sethithik</tspan></text>
<text id="header-4" x="590" text-anchor="middle" font-size="13" font-weight="bold"><tspan x="590" y="20">Ora—aku durung</tspan><tspan x="590" y="38">ngerti</tspan></text>
<text id="skill-1" x="5" y="69" font-size="12">nggunakake notasi pangurangan.</text>
<text id="skill-2" x="5" y="95" font-size="12">nggambarake pangurangan wilangan cacah nganggo model.</text>
<text id="skill-3" x="5" y="120" font-size="12">ngurangi wilangan cacah.</text>
<text id="skill-4" x="5" y="146" font-size="12">ngowahi frasa tembung dadi notasi matematika.</text>
<text id="skill-5" x="5" y="172" font-size="12">ngurangi wilangan cacah ing penerapan.</text>
