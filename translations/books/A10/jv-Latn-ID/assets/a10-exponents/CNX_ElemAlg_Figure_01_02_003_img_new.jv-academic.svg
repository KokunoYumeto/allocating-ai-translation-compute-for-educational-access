<svg xmlns="http://www.w3.org/2000/svg" xml:lang="jv-Latn-ID" width="940" height="100" viewBox="0 0 940 100" role="img" aria-labelledby="title desc">
<title id="title">wilangan pokok lan eksponen</title>
<desc id="desc">Angka loro ditampilake kanthi angka telu minangka superskrip ing sisih tengen ndhuwur. Sawijining panah nuding angka loro lan diwenehi label “wilangan pokok”, dene panah liyane nuding angka telu minangka superskrip lan diwenehi label “eksponen”. Tegese, gawea asil ping-pingan saka telung faktor sing saben-saben padha karo 2, yaiku 2 ping 2 ping 2.</desc>
<defs><marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#111"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Arial, sans-serif" font-size="20" fill="#111">
<text id="base-label" x="15" y="34" fill="#c21823">wilangan pokok</text>
<path id="base-arrow" d="M178 28 H214" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<text id="power-base" x="225" y="40" font-family="Georgia, serif" font-style="normal" font-size="30">2</text>
<text id="power-exponent" x="246" y="22" font-family="Georgia, serif" font-style="normal" font-size="19">3</text>
<path id="exponent-arrow" d="M295 18 H263" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<text id="exponent-label" x="309" y="26" fill="#006f80">eksponen</text>
<text id="explanation" x="450" y="32">tegese ping-pingan telung faktor sing padha karo 2,</text>
<text x="450" y="70">yaiku</text>
<text id="expanded-product" x="505" y="70" font-family="Georgia, serif" font-size="25">2 · 2 · 2.</text>
</g>
</svg>
